name: reset-releases

# 一次性工具：清空历史 Release 与 Tag，让版本号从 1.0.0 重新开始。
# 用法：Actions → reset-releases → Run workflow → confirm 里输入 RESET。
# 用完即删（它不该长期留在仓库里）。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 RESET 确认删除全部 Release 与 Tag（不可撤销）'
        required: true
        default: ''
      keep:
        description: '要保留的标签名（留空 = 全删）'
        required: false
        default: ''

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      # 必须先检出：gh 删 Release 时要用本地 git 上下文去处理对应的 Tag，
      # 没有仓库就直接报 "not a git repository" 失败（这也是本工作流第一次跑失败的原因）。
      - name: 检出（带全部标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 删除 Release 与 Tag
        run: |
          set -e
          if [ "${{ inputs.confirm }}" != "RESET" ]; then
            echo "confirm 不是 RESET，未做任何改动。"
            exit 1
          fi
          KEEP="${{ inputs.keep }}"
          echo "开始清理（保留：${KEEP:-无}）"
          gh release list --limit 100 --json tagName --jq '.[].tagName' > /tmp/tags.txt
          echo "现有 Release 数：$(wc -l < /tmp/tags.txt)"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ -n "$KEEP" ] && [ "$t" = "$KEEP" ]; then echo "跳过 $t"; continue; fi
            echo "删除 Release 与 Tag：$t"
            gh release delete "$t" --yes --cleanup-tag || {
              gh release delete "$t" --yes || true
              git push origin --delete "$t" || true
            }
          done < /tmp/tags.txt
          echo "剩余 Release（应为空）："
          gh release list --limit 100 || true
          echo "剩余 Tag（应为空）："
          git ls-remote --tags origin | sed 's#.*refs/tags/##' || true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
