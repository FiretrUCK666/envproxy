name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: '要检查的引用（留空则用触发本次运行的引用）'
        type: string
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: 门禁 1：sh 语法检查
        run: |
          fail=0
          # 目录级通配：mac/ 根与 lib/ 下的脚本一起查，新增文件自动纳入，不需要改这里。
          for f in mac/*.sh mac/lib/*.sh; do
            [ -f "$f" ] || continue
            # 逐文件报出文件名再解析：CI 上出错时日志要能直接指向是哪个文件，
            # 否则只看到一行 "bash: syntax error" 分不清来源。
            if ! err=$(bash -n "$f" 2>&1); then
              echo "语法错误：$f"
              echo "$err"
              fail=1
            fi
          done
          # 壳↔核心：.command 直调入口，用的子命令必须在核心分派里；
          # mac/ 根下只留入口与定位器模板，多出来的 .sh 就是没回家的传话层。
          for f in mac/*.command; do
            for cmd in $(grep -oE 'envproxy\.sh [a-z-]+' "$f" | awk '{print $2}'); do
              if ! grep -qE "^[[:space:]]*$cmd\)" mac/envproxy.sh; then
                echo "$f 用的子命令 $cmd 在核心分派里没有"
                fail=1
              fi
            done
          done
          for f in mac/*.sh; do
            case "$f" in
              # 根下三种都有家：入口自身；定位器模板（被复制到固定位置）；
              # prompt-sync（被使用者的 shell source，不由入口加载，所以不进 CORE_LIBS）。
              mac/envproxy.sh|mac/locator.sh|mac/prompt-sync.sh) ;;
              *) echo "$f 在 mac/ 根下没有家：根下只留入口、定位器模板与 shell 集成脚本"; fail=1;;
            esac
          done
          # 入口声明的库清单必须与 lib/ 实际内容一致：加库忘改入口、删库留空壳、改名漏一处都拦住。
          # 比的是集合（都排序后比），不比顺序——入口里的顺序是加载依赖顺序，不必等于字母序。
          declared=$(grep -oE '^CORE_LIBS="[^"]*"' mac/envproxy.sh | sed 's/^CORE_LIBS="//; s/"$//' | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')
          actual=$(ls mac/lib/*.sh 2>/dev/null | sed 's|^mac/lib/||; s|\.sh$||' | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$declared" != "$actual" ]; then
            echo "入口声明的库清单与 lib/ 实际内容不一致"
            echo "  入口声明: [$declared]"
            echo "  实际文件: [$actual]"
            fail=1
          fi
          # 库文件名不得含 envproxy：定位器按 find -name "envproxy.sh" 找入口，同名会被误选成入口。
          for f in mac/lib/*.sh; do
            [ -f "$f" ] || continue
            case "$f" in
              *envproxy*) echo "$f 文件名含 envproxy，会与定位器/单实例识别冲突"; fail=1;;
            esac
          done
          # 库不得自行推算"我在哪"：库里的 "$0" 与 $BASH_SOURCE 指的是库文件自己，拿它当入口路径
          # 会去启动一个跑不起来的文件（装完没有监控、日志里连一行都不会有），要用入口发布的
          # SCRIPT_DIR / SCRIPT_PATH。只认带引号的 "$0"——awk 程序里的裸 $0 是"当前记录"，不算；
          # 整行注释里提到这两个名字也不算（规则要能长期留人，不能逼着注释绕开变量名）。
          for f in mac/lib/*.sh; do
            [ -f "$f" ] || continue
            hits=$(grep -nE '"\$0"|\$\{?BASH_SOURCE' "$f" 2>/dev/null | grep -vE '^[0-9]+:[[:space:]]*#' || true)
            if [ -n "$hits" ]; then
              echo "$f 引用了入口专属的脚本自身路径（库要用入口发布的 SCRIPT_DIR / SCRIPT_PATH）："
              echo "$hits"
              fail=1
            fi
          done
          # 函数名不许重复：bash 会静默地用后定义的覆盖先定义的（改了没生效的经典陷阱）。
          # 模式要认全几种写法（function f {、f() {、f () {），否则重名照样漏过去。
          # 注意这条扫的是**源码文本**，不区分"运行期才定义"：测试里用替身覆盖生产函数时，
          # 要写成 eval 'f() { ... }'，否则会被判成重名覆盖（真实函数仍在 probe 层）。
          dup=$(cat mac/envproxy.sh mac/lib/*.sh 2>/dev/null \
            | grep -oE '^[[:space:]]*(function[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(\)[[:space:]]*\{' \
            | sed -E 's/^[[:space:]]*(function[[:space:]]+)?//; s/[[:space:]]*\(\)[[:space:]]*\{$//' \
            | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "库之间出现重名函数（后定义的会静默覆盖先定义的）："
            echo "$dup"
            fail=1
          fi
          # 每个声明的库都必须真的实现了东西：空壳或只有注释的文件在语法上完全合法，
          # 却会让整个 mac 侧起不来（Windows 侧同样有一条，见 tests/test-win-pure.ps1 里的 $PROFILE 钩子那一段）。
          for _lib in $declared; do
            _lf="mac/lib/$_lib.sh"
            if [ ! -f "$_lf" ]; then echo "声明的库不存在：$_lf"; fail=1; continue; fi
            if ! grep -qE '^[[:space:]]*(function[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(\)[[:space:]]*\{' "$_lf"; then
              echo "库 $_lf 里没有任何函数定义（空壳），装上去 mac 侧起不来"
              fail=1
            fi
          done
          # macOS 自带 bash 3.2，而 CI 是 bash 5：只有 4.0+ 才有的写法在这就被拦住。
          # 目录级通配（根下新增 .sh 自动纳入；根下本就不该多文件，门禁 1 另有拦截）。
          for f in mac/*.sh mac/lib/*.sh; do
            [ -f "$f" ] || continue
            hits=$(grep -nE '(declare|local)[[:space:]]+-A|(^|[^[:alnum:]_])(mapfile|readarray)([[:space:]]|$)|(^|[[:space:];|&()])wait[[:space:]]+-n([[:space:];]|$)|local[[:space:]]+-n[[:space:]]|\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(\^\^|,,)|\$\{[^}]*@(Q|U|u|E|a|A)\}|\bcoproc\b|globstar|EPOCHSECONDS|EPOCHREALTIME|SRANDOM|BASHPID|\[\[[[:space:]]*-v([[:space:]]|;)|&>>|\|&' "$f" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "$f 出现 bash 4+ 专有写法（macOS 自带 3.2 会失败）："
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      - name: 门禁 2：ps1 语法检查
        shell: pwsh
        run: |
          # 目录级：入口与 lib\ 下的每一个 .ps1 都单独解析（点源方案里，坏一个库等于整个程序起不来）
          $psFiles = @(Get-ChildItem 'win' -Filter *.ps1 -File -Recurse)
          foreach ($f in $psFiles) {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count) { Write-Host ("{0} 解析失败：" -f $f.Name); $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          }
          # 裸变量路径扫描（入口参数守卫那条契约的延伸）：关键 cmdlet 直接吃变量路径会踩通配符语义，
          # 必须走 helper 或 -LiteralPath。注释行与带 -LiteralPath 的行不计。
          foreach ($f in $psFiles) {
            $lines2 = Get-Content $f.FullName -Encoding UTF8
            for ($i = 0; $i -lt $lines2.Count; $i++) {
              $l = $lines2[$i]
              if ($l.Trim().StartsWith('#')) { continue }
              if ($l -match '(Test-Path|Get-Content|Set-Content|Add-Content|Remove-Item|Copy-Item|Move-Item|Get-ChildItem|Get-Item)\s+\$[A-Za-z_]+(\s|\)|;|,|$)') {
                if ($l -match '-LiteralPath') { continue }
                Write-Host ("裸变量路径（{0} 第 {1} 行）：{2}" -f $f.Name, ($i + 1), $l.Trim())
                exit 1
              }
            }
          }
          # 库清单一致：入口声明的 $CoreLibs 必须与 lib\ 实际内容完全一致
          $entryText = Get-Content 'win/envproxy.ps1' -Raw -Encoding UTF8
          $declaredRaw = [regex]::Match($entryText, '\$CoreLibs\s*=\s*@\(([^)]*)\)').Groups[1].Value
          $declared = @([regex]::Matches($declaredRaw, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value } | Sort-Object)
          $actual = @(Get-ChildItem 'win\lib' -Filter *.ps1 -File | ForEach-Object { $_.BaseName } | Sort-Object)
          if (($declared -join ',') -ne ($actual -join ',')) {
            Write-Host '入口声明的库清单与 lib\ 实际内容不一致'
            Write-Host ("  入口声明: {0}" -f ($declared -join ' '))
            Write-Host ("  实际文件: {0}" -f ($actual -join ' '))
            exit 1
          }
          # 库文件名不得含 envproxy（监控进程按 -File "...envproxy.ps1" 识别身份，同名会被误认）
          foreach ($f in Get-ChildItem 'win\lib' -Filter *.ps1 -File) {
            if ($f.BaseName -match 'envproxy') { Write-Host ("{0} 文件名含 envproxy，会与监控进程识别冲突" -f $f.Name); exit 1 }
          }
          # 库不得自行推算"我在哪"：库被点源后 $PSCommandPath / $PSScriptRoot 指的是库文件自己，
          # 拿它当入口路径会去启动一个跑不起来的库文件（安装后没有监控、日志里连一行都没有）。
          # 用语法树找变量引用，注释与字符串里提到不算。
          foreach ($f in Get-ChildItem 'win\lib' -Filter *.ps1 -File) {
            $tk2 = $null; $er2 = $null
            $ast2 = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tk2, [ref]$er2)
            $selfPath = @($ast2.FindAll({ param($n) $n -is [System.Management.Automation.Language.VariableExpressionAst] -and ($n.VariablePath.UserPath -eq 'PSCommandPath' -or $n.VariablePath.UserPath -eq 'PSScriptRoot') }, $true))
            if ($selfPath.Count) {
              Write-Host ('{0} 引用了入口专属的自动变量：库里的这两个变量指向库文件自己，库要用入口发布的 $ScriptDir / $ScriptPath。' -f $f.Name)
              $selfPath | ForEach-Object { Write-Host ("  第 {0} 行: {1}" -f $_.Extent.StartLineNumber, $_.Extent.Text) }
              exit 1
            }
          }
          # 函数名不许重复：点源后同名函数会被后定义的静默覆盖（改了没生效的经典陷阱）
          $names = @()
          foreach ($f in $psFiles) {
            $tk = $null; $er = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tk, [ref]$er)
            $names += @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object { $_.Name })
          }
          $dup = @($names | Group-Object | Where-Object { $_.Count -gt 1 })
          if ($dup.Count) {
            Write-Host '库之间出现重名函数（后定义的会静默覆盖先定义的）：'
            $dup | ForEach-Object { Write-Host ("  {0} x{1}" -f $_.Name, $_.Count) }
            exit 1
          }
          # 壳↔核心：.cmd 用的开关必须在核心 param() 里存在
          $paramBlock = [regex]::Match($entryText, '(?s)param\((.*?)\n\)').Groups[1].Value
          foreach ($f in Get-ChildItem win/*.cmd) {
            $t = Get-Content $f.FullName -Raw
            foreach ($m in [regex]::Matches($t, 'envproxy\.ps1"?\s+-(\w+)')) {
              $sw = $m.Groups[1].Value
              if ($paramBlock -notmatch ('\$' + $sw + '\b')) { Write-Host ("{0} 用的开关 -{1} 在核心 param() 里没有" -f $f.Name, $sw); exit 1 }
            }
          }

      - name: 门禁 3：编码红线检查
        shell: pwsh
        run: |
          $fail = 0
          # win：入口与 lib\ 下的每个 .ps1 都必须带 UTF-8 BOM
          # （PowerShell 5.1 在中文系统按 ANSI 读无 BOM 文件会语法报错）
          foreach ($f in @(Get-ChildItem 'win' -Filter *.ps1 -File -Recurse)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if (-not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
              Write-Host ("{0} 缺少 UTF-8 BOM" -f $f.FullName.Replace($PWD.Path + [System.IO.Path]::DirectorySeparatorChar, ''))
              $fail = 1
            }
          }
          # mac：入口、定位器、菜单壳与 lib\ 下的每个 .sh 都必须 LF、无 BOM
          foreach ($f in @(Get-ChildItem mac/*.sh) + @(Get-ChildItem mac/*.command) + @(Get-ChildItem mac/lib/*.sh)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { Write-Host ("{0} 带了 BOM" -f $f.Name); $fail = 1 }
            if ([System.Text.Encoding]::UTF8.GetString($b).Contains([string][char]13 + [string][char]10)) { Write-Host ("{0} 含 CRLF" -f $f.Name); $fail = 1 }
          }
          # win 全部 .cmd 纯 ASCII（.cmd 按 OEM 代码页读取，非 ASCII 会乱码）
          foreach ($f in Get-ChildItem win/*.cmd) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if (@($b | Where-Object { $_ -gt 0x7E }).Count) { Write-Host ("{0} 含非 ASCII 字符" -f $f.Name); $fail = 1 }
          }
          if ($fail) { exit 1 }
          Write-Host '编码红线通过'

      - name: 门禁 4：分发包内容
        shell: pwsh
        run: |
          # 读 git 输出的中文文件名前必须先统一编码：中文 Windows 上默认按 ANSI(GBK) 解码，
          # 中文名会变成乱码（例如 win/打开菜单.cmd 读成 win/鎵撳紑鑿滃崟.cmd），
          # 于是"路径不存在"这类断言在中文机器上永远为真。门禁必须与本机语言无关。
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # git archive 产出的安装包：顶层的集合必须与预期一致，且不含运行时目录。
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $tar = Join-Path $tmp 'envproxy-shipset.tar'
          git archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host 'git archive 失败'; exit 1 }
          # 读包内容一律 cd 进临时目录、只用文件名：GNU tar 会把 "C:\..." 里的 C: 当成远程主机
          # （报 Cannot connect to C:），于是 Windows 上这条门禁永远读到空列表、误报"内容不一致"。
          # CI 跑在 Linux 上不会踩到，但本地在 Windows 上就没法复跑这条门禁了。
          $entries = @(Push-Location $tmp; try { & tar -tf 'envproxy-shipset.tar' } finally { Pop-Location })
          $tops = @($entries | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
          $expect = @('LICENSE','README.en.md','README.md','VERSION','assets','mac','release-notes','win')
          $diff = Compare-Object $expect $tops
          if ($diff) {
            Write-Host '安装包顶层内容与预期不一致（左侧=预期，右侧=实际）：'
            $diff | ForEach-Object { Write-Host ("  {0} {1}" -f $_.SideIndicator, $_.InputObject) }
            Write-Host '新增仓库内部文件时，在 .gitattributes 里补 export-ignore；改动安装包内容时同步 README 第 8 节与本表。'
            exit 1
          }
          $bad = @($entries | Where-Object { $_ -match '^(win|mac)/monitor/' })
          if ($bad) { Write-Host '运行时目录进了安装包：'; $bad | ForEach-Object { Write-Host "  $_" }; exit 1 }
          # 双向：包内文件集必须等于"仓库文件集 − export-ignore"（目录内部的新文件也不能静默进包）。
          # 用 zip + Expand-Archive 取清单：Windows 自带 tar 按控制台编码解中文名会乱码，比对无意义。
          $zip2 = Join-Path $tmp 'envproxy-shipset.zip'
          Remove-Item $zip2 -Force -ErrorAction SilentlyContinue
          git archive --format=zip -o $zip2 HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host 'git archive (zip) 失败'; exit 1 }
          $xd = Join-Path $tmp 'envproxy-shipset-x'
          Remove-Item $xd -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip2 -DestinationPath $xd -Force
          $inPkg = @(Get-ChildItem $xd -Recurse -File | ForEach-Object { $_.FullName.Substring($xd.Length).TrimStart('/','\').Replace('\','/') } | Sort-Object)
          $ign = @(Select-String -Path .gitattributes -Pattern '^/(\S+?)\s+export-ignore' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          # git 输出中文文件名时是否转义受本机 core.quotepath 影响（CI 默认转义成本地看不懂的八进制），
          # 在这里写死关掉：门禁要的是确定性的 UTF-8 名单，不是本机配置的样子。
          # 两侧取同一棵树：包用 HEAD 的归档，仓库侧也用 HEAD 的文件清单
          # （用索引的话，本地"已暂存未提交"的新文件会让两边对不上——那是本地状态差异，不是包有问题）。
          $want = @(git -c core.quotepath=false ls-tree -r --name-only HEAD | Where-Object {
            $p = $_; $hit = $false
            foreach ($g in $ign) {
              if ($g.EndsWith('/')) { if ($p.StartsWith($g)) { $hit = $true; break } }
              elseif ($p -eq $g) { $hit = $true; break }
            }
            -not $hit
          } | Sort-Object)
          $diff2 = Compare-Object $want $inPkg
          if ($diff2) {
            Write-Host '包内文件集与"仓库 − export-ignore"不一致：'
            $diff2 | ForEach-Object { Write-Host ("  {0} {1}" -f $_.SideIndicator, $_.InputObject) }
            exit 1
          }
          # 分平台包：内容 = 全集减去另一平台目录（与发版流水线同集合、不同产包命令）。
          # 更新入口下载的正是这两个分包，这里的形状校验即更新校验的形状部分。
          foreach ($sp in @(@{ Keep = 'win'; Drop = 'mac' }, @{ Keep = 'mac'; Drop = 'win' })) {
            $sa = Join-Path $tmp ("envproxy-split-{0}.zip" -f $sp.Keep)
            Remove-Item $sa -Force -ErrorAction SilentlyContinue
            git archive --format=zip -o $sa HEAD $sp.Keep README.md README.en.md LICENSE VERSION release-notes assets
            if ($LASTEXITCODE -ne 0) { Write-Host ("分包产出失败：" + $sp.Keep); exit 1 }
            $sd = Join-Path $tmp ("envproxy-split-{0}" -f $sp.Keep)
            Remove-Item $sd -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $sa -DestinationPath $sd -Force
            $sIn = @(Get-ChildItem $sd -Recurse -File | ForEach-Object { $_.FullName.Substring($sd.Length).TrimStart('/','\').Replace('\','/') } | Sort-Object)
            $sWant = @($want | Where-Object { $_ -notlike ($sp.Drop + '/*') } | Sort-Object)
            $sDiff = Compare-Object $sWant $sIn
            if ($sDiff) {
              Write-Host ("分包内容不对（" + $sp.Keep + "）：")
              $sDiff | ForEach-Object { Write-Host ("  {0} {1}" -f $_.SideIndicator, $_.InputObject) }
              exit 1
            }
          }
          Write-Host '分发包内容通过'

      - name: 门禁 5：文档一致性
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 本门禁要把 git 里的文件名与 README 正文里的路径逐字比对，必须先把解码统一到 UTF-8：
          # 中文 Windows 上默认按 ANSI(GBK) 解码，中文名成乱码，比对必然失败（假红）。
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Get-Anchor([string]$t) {
            $s = $t.ToLower() -replace '`',''
            $s = $s -replace '[^\p{L}\p{Nd}\s\-_]',''
            return ($s -replace ' ','-')
          }
          function Get-Levels([string]$p) {
            return @(Get-Content $p -Encoding UTF8 | Where-Object { $_ -match '^#{1,6} ' } | ForEach-Object { ($_ -replace '^(#+).*','$1').Length })
          }
          $fail = 0
          # a) 中英 README 的标题层级序列逐位置一致（节数与顺序）
          $zh = Get-Levels 'README.md'
          $en = Get-Levels 'README.en.md'
          if ($zh.Count -ne $en.Count) {
            Write-Host ("中英 README 节数不一致：中文 {0} / 英文 {1}" -f $zh.Count, $en.Count)
            $fail = 1
          } elseif (Compare-Object $zh $en -SyncWindow 0) {
            Write-Host '中英 README 标题层级序列不一致'
            $fail = 1
          }
          # b) 目录锚点：与条目文字自洽，且每条都能命中一个二级标题；二级标题都进了目录
          # 目录标题本身不计入（它由位置决定：目录块之前最后那个二级标题，不写死语言）
          foreach ($f in 'README.md','README.en.md') {
            $lines = Get-Content $f -Encoding UTF8
            $inToc = $false; $seenToc = $false; $toc = @(); $tocHeading = $null
            foreach ($l in $lines) {
              if ($l -match '<!--\s*toc:start\s*-->') { $inToc = $true; $seenToc = $true; continue }
              if ($l -match '<!--\s*toc:end\s*-->') { $inToc = $false; continue }
              if ((-not $seenToc) -and ($l -match '^##\s+')) { $tocHeading = Get-Anchor ($l -replace '^##\s+','') }
              if ($inToc -and $l -match '^\s*-\s+\[(.*)\]\(#(.*)\)\s*$') { $toc += [pscustomobject]@{ Text = $Matches[1]; Anchor = $Matches[2] } }
            }
            if (-not $tocHeading) { Write-Host ("{0}：目录块前面没有二级标题（目录本身要有标题）" -f $f); $fail = 1 }
            $heads = @($lines | Where-Object { $_ -match '^##\s+' } | ForEach-Object { Get-Anchor ($_ -replace '^##\s+','') })
            foreach ($t in $toc) {
              if ((Get-Anchor $t.Text) -ne $t.Anchor) { Write-Host ("{0}：目录锚点与条目文字不符 [{1}]" -f $f, $t.Text); $fail = 1 }
              if ($heads -notcontains $t.Anchor) { Write-Host ("{0}：目录锚点找不到对应标题 {1}" -f $f, $t.Anchor); $fail = 1 }
            }
            foreach ($h in $heads) {
              if (($h -ne $tocHeading) -and (($toc | ForEach-Object { $_.Anchor }) -notcontains $h)) { Write-Host ("{0}：二级标题没进目录 {1}" -f $f, $h); $fail = 1 }
            }
            # 正文里的锚点链接也要命中一个标题（改标题或改节号时不会静默断链）
            $allHeads = @($lines | Where-Object { $_ -match '^#{2,3}\s+' } | ForEach-Object { Get-Anchor ($_ -replace '^#{2,3}\s+','') })
            foreach ($m in [regex]::Matches(($lines -join "`n"), '\]\(#([^)]+)\)')) {
              $a = $m.Groups[1].Value
              if ($allHeads -notcontains $a) { Write-Host ("{0}：正文锚点找不到对应标题 {1}" -f $f, $a); $fail = 1 }
            }
          }
          # c) README 里不写死版本号（写死了每发一版就过期）
          foreach ($f in 'README.md','README.en.md') {
            $hit = Select-String -Path $f -Pattern '(?<![\d.])v?\d+\.\d+\.\d+(?![\d.])' -Encoding UTF8
            if ($hit) {
              Write-Host ("{0}：出现写死的版本号" -f $f)
              $hit | ForEach-Object { Write-Host ("  行 {0}" -f $_.LineNumber) }
              $fail = 1
            }
          }
          # d) 安装包里的每个顶层条目都要写进两语 README 第 8 节的文件夹清单代码块里
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $tar = Join-Path $tmp 'envproxy-docset.tar'
          Remove-Item $tar -Force -ErrorAction SilentlyContinue
          git archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host 'git archive 失败，无法比对安装包内容'; exit 1 }
          # 读包内容一律 cd 进临时目录、只用文件名：GNU tar 会把 "C:\..." 里的 C: 当成远程主机
          # （报 Cannot connect to C:），于是 Windows 上读到空列表、误报"内容为空"。
          $tops = @(Push-Location $tmp; try { & tar -tf 'envproxy-docset.tar' } finally { Pop-Location }) |
                  ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique
          if ($tops.Count -eq 0) { Write-Host '安装包内容为空，比对无意义（门禁不通过）'; exit 1 }
          foreach ($f in 'README.md','README.en.md') {
            $lines = Get-Content $f -Encoding UTF8
            $start = -1
            for ($k = 0; $k -lt $lines.Count; $k++) {
              if ($lines[$k] -match '^##\s*8\.') { $start = $k; break }
            }
            if ($start -lt 0) { Write-Host ("{0}：找不到第 8 节（文件夹清单所在节）" -f $f); $fail = 1; continue }
            $inFence = $false
            $block = @()
            for ($k = $start; $k -lt $lines.Count; $k++) {
              if ($lines[$k] -match '^```') {
                if (-not $inFence) { $inFence = $true; continue } else { break }
              }
              if ($inFence) { $block += $lines[$k] }
            }
            if ($block.Count -eq 0) { Write-Host ("{0}：第 8 节里找不到文件夹清单代码块" -f $f); $fail = 1; continue }
            $blob = $block -join "`n"
            foreach ($t in $tops) {
              if ($blob -notmatch [regex]::Escape($t)) { Write-Host ("{0}：第 8 节清单里没有安装包条目 {1}" -f $f, $t); $fail = 1 }
            }
          }
          # e) 发版说明随版：VERSION 抬了，发版说明必须同交（否则推标签时才报错，而标签不许重打）
          $ver = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          if (-not (Test-Path "release-notes/v$ver.md")) { Write-Host ("缺 release-notes/v{0}.md：抬了 VERSION 必须同交发版说明" -f $ver); $fail = 1 }
          # f) 块级结构：每个二级节里（表格行数，配图数，列表项数，代码围栏行数，details 数）中英必须一致
          function Get-SecStruct([string[]]$lines) {
            $secs = @(); $cur = @(); $inSec = $false
            foreach ($l in $lines) {
              if ($l -match '^##\s+') { if ($inSec) { $secs += ,@($cur) }; $cur = @(); $inSec = $true }
              elseif ($inSec) { $cur += $l }
            }
            if ($inSec) { $secs += ,@($cur) }
            $out = @()
            foreach ($s in $secs) {
              $tables = @($s | Where-Object { $_ -match '^\|' }).Count
              $imgs = ([string]::Join("`n", $s) | Select-String -Pattern '<img\s' -AllMatches).Matches.Count
              $bullets = @($s | Where-Object { $_ -match '^\s*[-*]\s+' }).Count
              $fences = @($s | Where-Object { $_ -match '^```' }).Count
              $details = @($s | Where-Object { $_ -match '<details|</details>' }).Count
              $out += ,@($tables, $imgs, $bullets, $fences, $details)
            }
            return $out
          }
          $zhLines = Get-Content 'README.md' -Encoding UTF8
          $enLines = Get-Content 'README.en.md' -Encoding UTF8
          $sz = Get-SecStruct $zhLines; $se = Get-SecStruct $enLines
          if ($sz.Count -ne $se.Count) { Write-Host '中英二级节数量不一致（块结构比对无意义）'; $fail = 1 }
          else {
            for ($i = 0; $i -lt $sz.Count; $i++) {
              if (($sz[$i] -join ',') -ne ($se[$i] -join ',')) { Write-Host ("第 {0} 个二级节块结构不一致：中文 [{1}] / 英文 [{2}]" -f ($i + 1), ($sz[$i] -join ','), ($se[$i] -join ',')); $fail = 1 }
            }
          }
          # g) 第 8 节散文必须点名四个程序目录（只靠代码块里的清单不够：散文不写，进包范围改了用户也不知道）
          foreach ($pair in @(@('README.md','##\s*8\.'), @('README.en.md','##\s*8\.'))) {
            $fl = Get-Content $pair[0] -Encoding UTF8
            $start = -1
            for ($k = 0; $k -lt $fl.Count; $k++) { if ($fl[$k] -match $pair[1]) { $start = $k; break } }
            if ($start -ge 0) {
              $prose = @()
              $inF = $false
              for ($k = $start + 1; $k -lt $fl.Count; $k++) {
                if ($fl[$k] -match '^##\s+') { break }
                if ($fl[$k] -match '^```') { $inF = -not $inF; continue }
                if ($fl[$k] -match '^\s*<img') { continue }
                if (-not $inF) { $prose += $fl[$k] }
              }
              $blob = $prose -join "`n"
              foreach ($w in @('win','mac','release-notes','assets')) {
                if ($blob -notmatch [regex]::Escape($w)) { Write-Host ("{0} 第 8 节散文里没点名 {1}" -f $pair[0], $w); $fail = 1 }
              }
            }
          }
          # h) 文档里引用的程序路径必须存在（改名、挪文件时不会静默断链；monitor\ 是运行时目录，跳过）
          # 名单取自 git：同样写死 core.quotepath=false，否则 CI 上中文名是转义的、前缀比对永远命中不了。
          $repoFiles = @(git -c core.quotepath=false ls-files | ForEach-Object { $_ -replace '\\','/' })
          foreach ($f in @('README.md','README.en.md','CONTRIBUTING.md')) {
            $t = Get-Content $f -Raw -Encoding UTF8
            foreach ($m in [regex]::Matches($t, '`((?:win|mac)[\\/][^`]*?)`')) {
              $raw = $m.Groups[1].Value.Trim()
              $p = ($raw -split '\s+')[0].TrimEnd('*').TrimEnd('.', ',', ':', ';')
              if ($p -match '^(win|mac)[\\/]') {
                if ($p -match 'monitor[\\/]') { continue }
                $pn = ($p -replace '\\','/').TrimEnd('/')
                $ok = $false
                foreach ($rf in $repoFiles) { if ($rf -eq $pn -or $rf.StartsWith($pn + '/') -or $rf.StartsWith($pn + '.')) { $ok = $true; break } }
                if (-not $ok) { Write-Host ("{0} 引用的路径不存在：{1}" -f $f, $raw); $fail = 1 }
              }
            }
          }
          if ($fail) { exit 1 }
          Write-Host '文档一致性通过'

      - name: 门禁 6：契约常量与变量集
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 常量住在哪一个库里不是门禁该管的事：把整个脚本集拼起来再找。
          # 于是新增库、把常量挪到别的库、入口变薄，都不会让这条门禁误报或失明。
          $ps = (@(Get-ChildItem 'win' -Filter *.ps1 -File -Recurse | Sort-Object Name |
              ForEach-Object { Get-Content $_.FullName -Raw -Encoding UTF8 }) -join "`n")
          $sh = (@(Get-ChildItem 'mac' -Filter *.sh -File -Recurse | Sort-Object Name |
              ForEach-Object { Get-Content $_.FullName -Raw -Encoding UTF8 }) -join "`n")
          $fail = 0
          # 语料是"整个脚本集拼起来"的，同一模式可能在多处命中；取第一个匹配就等于悄悄
          # 选了一个未必是运行时那个的值。所以命中数必须恰好为 1，模棱两可就当场失败。
          function Grab([string]$text, [string]$pattern, [string]$label) {
            $ms = [regex]::Matches($text, $pattern)
            if ($ms.Count -eq 0) { Write-Host ("找不到 " + $label); return $null }
            if ($ms.Count -gt 1) { Write-Host ("语料里有多处匹配，无法确定权威值：" + $label + "（" + $ms.Count + " 处）"); return $null }
            return $ms[0].Groups[1].Value
          }
          # 变量集合：Windows 5 个全大写；macOS 9 个（含 4 个小写拼写）
          $winSet = Grab $ps '\$ProxyVarNames\s*=\s*@\(([^)]*)\)' 'Windows 变量集合'
          if ($winSet) {
            $names = @($winSet -split ',' | ForEach-Object { $_.Trim().Trim('"') } | Where-Object { $_ })
            if ($names.Count -ne 5) { Write-Host ("Windows 变量数不是 5：{0}" -f $names.Count); $fail = 1 }
            foreach ($n in $names) {
              if ($n -cne $n.ToUpper()) { Write-Host ("Windows 侧出现非大写拼写：{0}（.NET 宿主会因重复键报错）" -f $n); $fail = 1 }
            }
          } else { $fail = 1 }
          $macNames = @([regex]::Matches($sh, "(?m)^\s*printf 'export ([A-Za-z_]+)=") | ForEach-Object { $_.Groups[1].Value })
          if ($macNames.Count -ne 9) { Write-Host ("macOS 变量数不是 9：{0}" -f $macNames.Count); $fail = 1 }
          # 变量名单必须只有一个定义处，所有循环都遍历它。
          # 早先这里是"把所有 for 循环里的字面名并起来比集合"——那证明不了它声称的事：
          # 只要别处还有一个含该名的循环，把 ALL_PROXY 从回收清单里删掉也能通过。
          # 现在改成两条更硬的断言：
          #   a) 常量定义正确（PROXY_VAR_NAMES 9 个、地址 6 个、NO_PROXY 2 个）；
          #   b) 不再有任何 for 循环手抄变量名——手抄就当场失败。
          # 这样"改名只改一处"从承诺变成机制：谁再手抄一份，门禁立刻红。
          $mac9 = @('HTTP_PROXY', 'http_proxy', 'HTTPS_PROXY', 'https_proxy', 'ALL_PROXY', 'all_proxy', 'NO_PROXY', 'no_proxy', 'NODE_USE_ENV_PROXY')
          $macAddr = @('HTTP_PROXY', 'http_proxy', 'HTTPS_PROXY', 'https_proxy', 'ALL_PROXY', 'all_proxy')
          # 定义行要精确锚定行首，否则 PROXY_VAR_NAMES 会同时匹配上 NO_PROXY_VAR_NAMES。
          $pvn = Grab $sh '(?m)^PROXY_VAR_NAMES="([^"]*)"' 'macOS 变量总表'
          $pav = Grab $sh '(?m)^PROXY_ADDR_VAR_NAMES="([^"]*)"' 'macOS 地址变量表'
          $npv = Grab $sh '(?m)^NO_PROXY_VAR_NAMES="([^"]*)"' 'macOS NO_PROXY 变量表'
          if (-not $pvn -or -not $pav -or -not $npv) { $fail = 1 }
          else {
            $pvnSet = @($pvn -split '\s+' | Where-Object { $_ } | Sort-Object)
            $pavSet = @($pav -split '\s+' | Where-Object { $_ } | Sort-Object)
            $npvSet = @($npv -split '\s+' | Where-Object { $_ } | Sort-Object)
            if ((($pvnSet) -join ',') -ne ((@($mac9) | Sort-Object) -join ',')) { Write-Host ("PROXY_VAR_NAMES 内容与契约不符：" + ($pvnSet -join ' ')); $fail = 1 }
            if ((($pavSet) -join ',') -ne ((@($macAddr) | Sort-Object) -join ',')) { Write-Host ("PROXY_ADDR_VAR_NAMES 内容与契约不符：" + ($pavSet -join ' ')); $fail = 1 }
            if ((($npvSet) -join ',') -ne 'NO_PROXY,no_proxy') { Write-Host ("NO_PROXY_VAR_NAMES 内容与契约不符：" + ($npvSet -join ' ')); $fail = 1 }
          }
          # lib\ 下的循环体里不许再出现字面变量名：必须遍历上面的常量。
          # locator.sh 是独立的登录期脚本（不加载任何库，必须自带清单），不在本条约束内，
          # 所以只扫 lib\ ——否则会把它当成违规，逼着它去加载库，反而破坏它"能独立跑"的前提。
          $libSh = (@(Get-ChildItem 'mac/lib' -Filter *.sh -File | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw -Encoding UTF8 }) -join "`n")
          $literalLoops = @([regex]::Matches($libSh, '(?m)^\s*for [A-Za-z_]+ in (?:[A-Za-z_ ]*\b(?:HTTP_PROXY|http_proxy|HTTPS_PROXY|https_proxy|ALL_PROXY|all_proxy|NO_PROXY|no_proxy|NODE_USE_ENV_PROXY)\b[A-Za-z_ ]*); do'))
          if ($literalLoops.Count) {
            Write-Host ("lib\ 里有 for 循环手抄了变量名（应改为遍历 PROXY_VAR_NAMES / PROXY_ADDR_VAR_NAMES / NO_PROXY_VAR_NAMES）：")
            foreach ($m in $literalLoops) { Write-Host ("  " + $m.Value.Trim()) }
            $fail = 1
          }
          $lowerCount = @($macNames | Where-Object { $_ -ceq $_.ToLower() }).Count
          if ($lowerCount -ne 4) { Write-Host ("macOS 侧小写拼写应恰为 4 个，实际 {0}" -f $lowerCount); $fail = 1 }
          # NO_PROXY 默认值：两侧一致、含裸写 ::1、不含方括号
          $winNp = Grab $ps '\$DefaultNoProxy\s*=\s*"([^"]*)"' 'Windows NO_PROXY 默认值'
          $macNp = Grab $sh 'DEFAULT_NO_PROXY="([^"]*)"' 'macOS NO_PROXY 默认值'
          if ($winNp -and $macNp -and ($winNp -ne $macNp)) { Write-Host ("两侧 NO_PROXY 默认值不一致：{0} / {1}" -f $winNp, $macNp); $fail = 1 }
          if ($winNp -and ($winNp -notmatch '(^|,)::1(,|$)')) { Write-Host ("NO_PROXY 缺少裸写 ::1：{0}" -f $winNp); $fail = 1 }
          if ($winNp -and ($winNp -match '\[')) { Write-Host ("NO_PROXY 出现方括号（httpx 会每次请求报错）：{0}" -f $winNp); $fail = 1 }
          # 行为阈值：两侧取值必须一致
          $pairs = @(
            @('\$NodeFailThreshold\s*=\s*(\d+)', 'NODE_FAIL_THRESHOLD=(\d+)', '连续失败判"断"阈值'),
            @('\$NodeCheckThrottleSec\s*=\s*(\d+)', 'NODE_CHECK_THROTTLE_SEC=(\d+)', '真实探测节流秒数'),
            @('\$NodeFastSec\s*=\s*(\d+)', 'NODE_FAST_SEC=(\d+)', '存疑期加密探测间隔'),
            @('\$NodeFailDwellSec\s*=\s*(\d+)', 'NODE_FAIL_DWELL_SEC=(\d+)', '连续失败判"断"所需秒数'),
            @('\$NodeFastWindowSec\s*=\s*(\d+)', 'NODE_FAST_WINDOW_SEC=(\d+)', '下结论后的加密观察窗口'),
            @('\$NodeIdleResetSec\s*=\s*(\d+)', 'NODE_IDLE_RESET_SEC=(\d+)', '槽位闲置丢弃门槛')
          )
          foreach ($p in $pairs) {
            $a = Grab $ps $p[0] ($p[2] + '（Win 侧）')
            $b = Grab $sh $p[1] ($p[2] + '（Mac 侧）')
            if ((-not $a) -or (-not $b)) { $fail = 1; continue }
            if ($a -ne $b) { Write-Host ("{0} 两侧不一致：Win {1} / Mac {2}" -f $p[2], $a, $b); $fail = 1 }
          }
          # d1b) 帮助一屏的行数上限：两侧必须同一个数。
          # 它决定「帮助会不会被终端切掉底部」，一侧改了另一侧没改，两个平台就会
          # 一屏放得下、另一屏放不下——同一个产品两种体验，而且原因很难查。
          $helpLinesWin = Grab $ps '\$HelpMaxLines\s*=\s*(\d+)' 'Win 帮助行数上限'
          $helpLinesMac = Grab $sh 'HELP_MAX_LINES=(\d+)' 'Mac 帮助行数上限'
          if ((-not $helpLinesWin) -or (-not $helpLinesMac)) {
            Write-Host '帮助行数上限常量缺失（两侧都要有具名常量，不许写死在测试里）'
            $fail = 1
          } elseif ($helpLinesWin -ne $helpLinesMac) {
            Write-Host ("帮助行数上限两侧不一致：Win {0} / Mac {1}" -f $helpLinesWin, $helpLinesMac)
            $fail = 1
          }
          # d2) 终端同步的标记块必须两侧同字面：卸载靠它精确摘除，两侧不一致就摘不干净。
          #     这是一个字符串常量，不是数字，所以不进上面那张 $pairs 表。
          $bsWin = Grab $ps '\$ProfileBlockStart\s*=\s*''([^'']+)''' 'Win 块开始标记'
          $beWin = Grab $ps '\$ProfileBlockEnd\s*=\s*''([^'']+)''' 'Win 块结束标记'
          $bsMac = Grab $sh 'HOOK_START="([^"]+)"' 'Mac 块开始标记'
          $beMac = Grab $sh 'HOOK_END="([^"]+)"' 'Mac 块结束标记'
          if ((-not $bsWin) -or (-not $beWin) -or (-not $bsMac) -or (-not $beMac)) {
            Write-Host '终端同步标记块缺失（两侧都要有开始/结束标记）'
            $fail = 1
          } else {
            if ($bsWin -cne $bsMac) { Write-Host ("块开始标记两侧不一致：Win [{0}] / Mac [{1}]" -f $bsWin, $bsMac); $fail = 1 }
            if ($beWin -cne $beMac) { Write-Host ("块结束标记两侧不一致：Win [{0}] / Mac [{1}]" -f $beWin, $beMac); $fail = 1 }
          }
          # d3) rc 里注入的那一行必须引用固定位置的实现，且**只读不写**：
          #     它在使用者的每次提示符/启动时执行，绝不能是写操作或别名。
          if ($sh -notmatch 'HOOK_LINE=''\[ -r "\$HOME/\.envproxy/prompt-sync\.sh" \] && \. "\$HOME/\.envproxy/prompt-sync\.sh"''') {
            Write-Host 'Mac 的 HOOK_LINE 不是"条件读取固定位置实现"的标准形态'
            $fail = 1
          }
          # e) 两侧变量名必须是同一批（只数个数挡不住改名或写错名）
          $winNames = @((Grab $ps '\$ProxyVarNames\s*=\s*@\(([^)]*)\)' 'Windows 变量集合') -split ',' |
            ForEach-Object { $_.Trim().Trim('"') } | Where-Object { $_ })
          $macUp = @($macNames | Where-Object { $_ -ceq $_.ToUpper() })
          if ((($winNames | Sort-Object) -join ',') -ne (($macUp | Sort-Object) -join ',')) {
            Write-Host ("两侧变量名不是同一批：Win=[{0}] Mac 大写=[{1}]" -f ($winNames -join ' '), ($macUp -join ' '))
            $fail = 1
          }
          # f) 端点表：两侧条数一致、macOS 的 host 与 path 条数一致（平行字符串不许错位）
          $hosts = Grab $sh 'CHECK_HOSTS="([^"]*)"' 'macOS 端点表'
          $paths = Grab $sh 'CHECK_PATHS="([^"]*)"' 'macOS 端点路径表'
          $hostCount = @($hosts -split '\s+' | Where-Object { $_ }).Count
          $pathCount = @($paths -split '\s+' | Where-Object { $_ }).Count
          $epCount = @([regex]::Matches($ps, '@\{ Host =')).Count
          if ($epCount -ne $hostCount) { Write-Host ("端点个数两侧不一致：Win {0} / Mac {1}" -f $epCount, $hostCount); $fail = 1 }
          if ($pathCount -ne $hostCount) { Write-Host ("macOS 端点表 host 与 path 条数不一致：{0} / {1}" -f $hostCount, $pathCount); $fail = 1 }
          # g) 事实清单：数字从代码取值，再查双语 README——代码改了、文档没跟上就当场失败
          $zh = Get-Content 'README.md' -Raw -Encoding UTF8
          $en = Get-Content 'README.en.md' -Raw -Encoding UTF8
          $psKB = [int](Grab $ps 'Length -gt (\d+)KB' 'Win 日志上限')
          $shBytes = [int](Grab $sh '\$_size"\s+-gt\s+(\d+)' 'Mac 日志上限')
          if (-not $psKB -or -not $shBytes) { $fail = 1 }
          elseif ($psKB * 1024 -ne $shBytes) { Write-Host ("日志上限两侧不一致：Win {0}KB / Mac {1}B" -f $psKB, $shBytes); $fail = 1 }
          # 日志截断行数必须锚定到"截断"那一行：状态显示也用 Select-Object -Last 3 / tail -n 3，
          # 不锚定就会取到状态显示的行数。常量住在哪个库不该影响门禁，所以按用法锚定而不是按文件。
          $psTail = [int](Grab $ps '\$keep\s*=\s*[^\n]*Select-Object -Last (\d+)' 'Win 截断行数')
          $shTail = [int](Grab $sh 'tail -n (\d+)\s+"\$LOG_FILE"\s+>\s+"\$LOG_FILE\.tmp"' 'Mac 截断行数')
          if (-not $psTail -or -not $shTail) { $fail = 1 }
          elseif ($psTail -ne $shTail) { Write-Host ("截断行数两侧不一致：Win {0} / Mac {1}" -f $psTail, $shTail); $fail = 1 }
          $psRep = [int](Grab $ps 'repairRound -ge (\d+)' 'Win 自愈轮次')
          $shRep = [int](Grab $sh '\$_repair -ge (\d+)' 'Mac 自愈轮次')
          if (-not $psRep -or -not $shRep) { $fail = 1 }
          elseif ($psRep -ne $shRep) { Write-Host ("自愈轮次两侧不一致：Win {0} / Mac {1}" -f $psRep, $shRep); $fail = 1 }
          $thr = [int](Grab $ps '\$NodeCheckThrottleSec\s*=\s*(\d+)' 'Win 节流秒数')
          $flr = [int](Grab $ps '\$NodeFailThreshold\s*=\s*(\d+)' 'Win 失败阈值')
          if (-not $thr -or -not $flr) { $fail = 1 }
          # 定位深度：用户目录 6 层、磁盘根 4 层，两侧都要有（英文用词不含数字，只查字面存在）
          if (([regex]::Matches($ps, 'Depth = 6')).Count -eq 0) { Write-Host 'Win 侧缺少用户目录搜索深度 Depth = 6'; $fail = 1 }
          if (([regex]::Matches($ps, 'Depth = 4')).Count -eq 0) { Write-Host 'Win 侧缺少磁盘根搜索深度 Depth = 4'; $fail = 1 }
          $locText = Get-Content 'mac/locator.sh' -Raw -Encoding UTF8
          if ($locText -notmatch '_search_one "\$_r" 6') { Write-Host '定位器缺少用户目录搜索深度 6'; $fail = 1 }
          if ($locText -notmatch '_search_one "\$_vol" 4') { Write-Host '定位器缺少磁盘根搜索深度 4'; $fail = 1 }
          # 判"断"双条件：次数由 $NodeFailThreshold 定，时长由 $NodeFailDwellSec 定，两者必须同现在 README。
          # 只钉次数的话，改了次数文档不动；只钉时长同理。两句一起断言才挡得住"改一个没改另一个"。
          $dwl = [int](Grab $ps '\$NodeFailDwellSec\s*=\s*(\d+)' 'Win 判"断"所需秒数')
          $fast = [int](Grab $ps '\$NodeFastSec\s*=\s*(\d+)' 'Win 存疑期加密间隔')
          if ((-not $dwl) -or (-not $fast) -or (-not $thr) -or (-not $flr)) { $fail = 1 }
          # 对外口径的时间区间由常量推导，不许手写。两个方向各算各的：
          #   判"断"（on → off）：离散按轮，最短 = dwell + 一轮去抖；
          #     最长 = 稳定态一轮采样 + dwell + 一次探测跑满超时 + 一轮去抖（都按时长向上取整到 5 秒）
          #   判"通"（off → on）：最快 = max((阈值-1) × 加密间隔, dwell) + 一轮去抖
          #     三个条件里"最后一个"可能是次数也可能是时长，取两者较晚的那个；
          #     稳定态那 15 秒是"多久才轮得到第一次探测"的抽样运气，可能恰好就撞上，故不计入下界。
          #     最慢 = 稳定态一轮采样 + 一次探测跑满超时 + max((阈值-1) × (加密间隔+超时), dwell) + 一轮去抖
          #     探测超时取"最长的那个读超时"（500ms 那处是快速握手试探，6000ms 才是真实连通性
          #     探测），取最大值即取到后者，不必锚定行号或函数名，将来加一档也不影响取到最坏值。
          # 两个值都向上取整到 5 秒，口径不带假精度。实测（快速失败 / 节点挂起）须落在区间内，见验收。
          $ptoMs = 0
          foreach ($m in [regex]::Matches($ps, '(?:ReceiveTimeout|ReadTimeout)\s*=\s*(\d+)')) {
            $v = [int]$m.Groups[1].Value
            if ($v -gt $ptoMs) { $ptoMs = $v }
          }
          if ($ptoMs -le 0) { Write-Host '找不到探测读超时，无法推导时间区间'; $fail = 1 }
          $pto = [int][math]::Ceiling($ptoMs / 1000.0)
          # 双轮去抖的时长由"轮数 × 该方向的轮间隔"推导，不写死：
          # 判"断"发生在 on 态（轮间隔 2 秒），判"通"发生在 off 态（轮间隔 3 秒），方向不同各取各的。
          $debRounds = [int](Grab $ps '\$StateDebounceRounds\s*=\s*(\d+)' 'Win 状态去抖轮数')
          $debMac = [int](Grab $sh 'STATE_DEBOUNCE_ROUNDS=(\d+)' 'Mac 状态去抖轮数')
          if ((-not $debRounds) -or (-not $debMac)) { $fail = 1 }
          elseif ($debRounds -ne $debMac) { Write-Host ("状态去抖轮数两侧不一致：Win {0} / Mac {1}" -f $debRounds, $debMac); $fail = 1 }
          # 轮间隔也读代码，别写死：改轮速时文档跟着动。
          $sleepOn = [int]([regex]::Match($ps, '\$sleepSec = \$\(if \(\$lastState -eq "off"\) \{ (\d+) \} else \{ (\d+) \}\)').Groups[2].Value)
          $sleepOff = [int]([regex]::Match($ps, '\$sleepSec = \$\(if \(\$lastState -eq "off"\) \{ (\d+) \} else \{ (\d+) \}\)').Groups[1].Value)
          $sleepOnMac = [int]([regex]::Match($sh, 'then sleep (\d+); else sleep (\d+);').Groups[2].Value)
          $sleepOffMac = [int]([regex]::Match($sh, 'then sleep (\d+); else sleep (\d+);').Groups[1].Value)
          if ((-not $sleepOn) -or (-not $sleepOff) -or ($sleepOn -ne $sleepOnMac) -or ($sleepOff -ne $sleepOffMac)) {
            Write-Host ("轮间隔缺失或两侧不一致：Win on/off={0}/{1}，Mac on/off={2}/{3}" -f $sleepOn, $sleepOff, $sleepOnMac, $sleepOffMac)
            $fail = 1
          }
          $debDown = $debRounds * $sleepOn      # 判"断"在 on 态
          $debUp   = $debRounds * $sleepOff     # 判"通"在 off 态
          # 观察窗按分钟对外表达（README 说的是"多盯 1 分钟"），常量是秒，换算一次。
          $fwin = [int](Grab $ps '\$NodeFastWindowSec\s*=\s*(\d+)' 'Win 观察窗秒数')
          if (-not $fwin) { $fail = 1 }
          elseif (($fwin % 60) -ne 0) { Write-Host ("观察窗必须是整分钟，才能对读者说「N 分钟」：当前 ${fwin} 秒"); $fail = 1 }
          $fwin = [int]($fwin / 60)
          # 恢复耗时：从"节点回来"到变量写回，最坏要等一次快档探测（$NodeFastSec）
          # 加两轮去抖；最好情形是刚探完就回来，仍要两轮去抖。同样向上取整到 5 秒。
          # 恢复耗时：从"节点回来"到变量写回，要等下一次探测（最坏是稳定档一整轮，
          # 因为判别"断"之后观察窗可能已经过期）再加两轮去抖（判通发生在 off 态，轮间隔取 off 的）。
          $reLo = [int]([math]::Ceiling($debUp / 5.0) * 5)
          $reHi = [int]([math]::Ceiling(($thr + $debUp) / 5.0) * 5)
          $loRaw = [math]::Max(($flr - 1) * $fast, $dwl) + $debDown
          $hiRaw = $thr + $pto + [math]::Max(($flr - 1) * ($fast + $pto), $dwl) + $debDown
          $lo = [int]([math]::Ceiling($loRaw / 5.0) * 5)
          $hi = [int]([math]::Ceiling($hiRaw / 5.0) * 5)
          $facts = @(
            @('端点个数', "$epCount 个不同的站点", "$epCount different sites"),
            @('日志上限', "${psKB}KB", "${psKB}KB"),
            @('日志截断行数', "最近 $psTail 行", "most recent $psTail lines"),
            @('自愈周期', "每 $psRep 轮", "every $psRep rounds"),
            @('探测节流', "${thr} 秒", "${thr} seconds"),
            @('判"断"双条件-次数', "至少 ${flr} 次", "at least ${flr} probes"),
            @('判"断"双条件-时长', "连续失败满 ${dwl} 秒", "${dwl} seconds of continuous failure"),
            @('只断开的时间区间', "约 ${lo}–${hi} 秒", "about ${lo}–${hi} seconds"),
            @('连回来的时间区间', "约 ${reLo}–${reHi} 秒", "about ${reLo}–${reHi} seconds"),
            # 下面两条是经验值，不能从常量精确推导：
            #   打开 = 去抖（deb × off 轮间隔）+ 一次探测的耗时，随软件启动快慢浮动，只能给区间；
            #   退出 = 状态机发现端口消失要先 sleep 2 秒再全扫，加去抖，落在 6 秒以上。
            # 常量推导只能给出下界，对外说的"约 N 秒"含实测量级，所以这里按字面量核：
            # 至少保证中英两份 README 写的是同一个数，不会一侧改一侧忘。
            @('打开翻墙的区间', '约 6–10 秒', 'about 6-10 seconds'),
            @('完全退出的耗时', '约 8 秒', 'about 8 seconds'),
            @('结论后的加密观察窗', "多盯 ${fwin} 分钟", "another ${fwin} minute"),
            @('用户目录深度', '向下 6 层', 'six levels'),
            @('磁盘根深度', '4 层', 'four levels')
          )
          foreach ($fact in $facts) {
            if ($zh -notmatch [regex]::Escape($fact[1])) { Write-Host ("中文 README 缺少事实「{0}」（应出现：{1}）" -f $fact[0], $fact[1]); $fail = 1 }
            if ($en -notmatch [regex]::Escape($fact[2])) { Write-Host ("英文 README 缺少事实「{0}」（应出现：{1}）" -f $fact[0], $fact[2]); $fail = 1 }
          }
          foreach ($n in $winNames) {
            if ($zh -notmatch [regex]::Escape($n)) { Write-Host ("中文 README 里没有变量 {0}" -f $n); $fail = 1 }
            if ($en -notmatch [regex]::Escape($n)) { Write-Host ("英文 README 里没有变量 {0}" -f $n); $fail = 1 }
          }
          # h) 更新源表：两侧必须同表（同条数、同字段数），官方源都在最前，
          #    且"API 资产端点优先"这条下载路径两侧都实现（含它必须的 Accept 头）。
          # 源表是「加源 = 加一行」的数据结构，两侧结构漂移会让回退行为不一致。
          $srcWin = @([regex]::Matches($ps, '@\{ Id = "\w+"'))
          $macTable = [regex]::Match($sh, "(?s)UPDATE_SOURCE_TABLE='(.*?)'").Groups[1].Value
          $srcMac = @($macTable -split "`n" | Where-Object { $_.Trim() })
          if ($srcWin.Count -ne $srcMac.Count) {
            Write-Host ("更新源表条数两侧不一致：Win {0} / Mac {1}" -f $srcWin.Count, $srcMac.Count); $fail = 1
          }
          # 顺序即优先级：官方源必须排在第一位。
          if ($ps -notmatch '@\{ Id = "official"') { Write-Host 'Win 侧源表里没有 official 源'; $fail = 1 }
          if ($srcMac.Count -and ($srcMac[0] -notmatch '^official[ ]')) { Write-Host 'Mac 侧源表第一条不是官方源'; $fail = 1 }
          # 字段数：Win 每源 7 个键（Id/Name/Preferred/Api/Web/Base/ApiRepo），Mac 每行 7 个空白分隔字段。
          $winEntry = [regex]::Match($ps, '@\{ Id = "official";(.*?)\}')
          if (-not $winEntry.Success) { Write-Host 'Win 侧源表条目没解析出来'; $fail = 1 }
          elseif (([regex]::Matches($winEntry.Groups[1].Value, '=')).Count + 1 -ne 7) {
            Write-Host 'Win 侧源表字段数不是 7（Id/Name/Preferred/Api/Web/Base/ApiRepo）'; $fail = 1
          }
          foreach ($line in $srcMac) {
            if (($line.Trim() -split '\s+').Count -ne 7) { Write-Host ("Mac 侧源表字段数不是 7：{0}" -f $line.Trim()); $fail = 1 }
          }
          # API 资产端点优先：两侧都要有资产下载路径，以及它必须的 Accept 头。
          foreach ($pair in @(@('Win', $ps), @('Mac', $sh))) {
            if ($pair[1] -notmatch '/releases/assets/') { Write-Host ("{0} 侧没有 API 资产端点下载路径" -f $pair[0]); $fail = 1 }
            if ($pair[1] -notmatch 'application/octet-stream') { Write-Host ("{0} 侧下载资产时没带 Accept: application/octet-stream" -f $pair[0]); $fail = 1 }
          }
          # 失败原因词表两侧必须同形：分类的意义是让用户知道该做什么（等/开代理/手动下载/修磁盘），
          # 两边词表一漂，提示就会在两个平台说不同的原因——同一个故障，两种说法。
          $winKinds = [regex]::Match($ps, '\$UpdateFailureKinds\s*=\s*@\(([^)]*)\)')
          $macKinds = [regex]::Match($sh, 'UPDATE_FAILURE_KINDS="([^"]*)"')
          if (-not $winKinds.Success) { Write-Host 'Win 侧找不到失败原因词表'; $fail = 1 }
          if (-not $macKinds.Success) { Write-Host 'Mac 侧找不到失败原因词表'; $fail = 1 }
          if ($winKinds.Success -and $macKinds.Success) {
            $wk = @([regex]::Matches($winKinds.Groups[1].Value, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
            $mk = @($macKinds.Groups[1].Value -split '\s+' | Where-Object { $_ })
            if (($wk -join ' ') -ne ($mk -join ' ')) {
              Write-Host ("失败原因词表两侧不一致：Win [{0}] / Mac [{1}]" -f ($wk -join ','), ($mk -join ','))
              $fail = 1
            }
            foreach ($k in @('missing', 'quota', 'server', 'network', 'bad-content', 'local')) {
              if ($wk -notcontains $k) { Write-Host ("Win 侧失败原因词表缺 {0}" -f $k); $fail = 1 }
              if ($mk -notcontains $k) { Write-Host ("Mac 侧失败原因词表缺 {0}" -f $k); $fail = 1 }
            }
          }
          # 资产解析的契约必须两侧同形：文件名区分大小写、编号形状一致、url 优先于 id。
          # 这些不是风格问题：认成大小写不敏感会去下错文件，编号不校验会把垃圾拼进 URL，
          # 两侧规则不同则同一个故障在两个平台报不同的错。
          foreach ($pair in @(@('Win', $ps), @('Mac', $sh))) {
            if ($pair[1] -notmatch '\^\[1-9\]\[0-9\]') { Write-Host ("{0} 侧没有校验资产编号的形状" -f $pair[0]); $fail = 1 }
            if ($pair[1] -notmatch 'releases/assets/') { Write-Host ("{0} 侧没有从 url 里取资产编号" -f $pair[0]); $fail = 1 }
            if ($pair[1] -notmatch 'sha256:') { Write-Host ("{0} 侧没有校验资产 digest 的形状" -f $pair[0]); $fail = 1 }
          }
          # Windows 侧用 -ceq 比文件名（区分大小写），mac 侧用字符串相等（也区分大小写）：
          # 两侧都必须区分大小写，GitHub 的资产名是大小写敏感的。
          if ($ps -notmatch '-cne\s+\$FileName') { Write-Host 'Win 侧没有用区分大小写的方式比文件名'; $fail = 1 }
          if ($sh -notmatch 'aname\s*==\s*want') { Write-Host 'Mac 侧没有用区分大小写的方式比文件名'; $fail = 1 }
          # Mac 侧的失败原因靠全局变量传，而命令替换跑在**子 shell** 里，全局赋值出不来。
          # 所以问版本这几个函数必须**直接调用**：套上 $(...) 的话原因会静默丢失，
          # 限流、缺包、服务端故障全被报成"连不上"，用户会被叫去开翻墙软件（白折腾）。
          # 这类问题曾真实发生过，靠人记不住，所以在这里拦。
          foreach ($fn in @('get_tag_from_api', 'get_tag_from_web', 'get_tag_from_source', 'get_remote_version_from', 'get_update_asset')) {
            if ($sh -match ('\$\(\s*' + $fn + '\b')) {
              Write-Host ("Mac 侧 {0} 被套进了命令替换，失败原因会丢失" -f $fn)
              $fail = 1
            }
          }
          # 查资产编号失败的原因必须参与挑选，否则"这条失败的路没走成"会隐形：
          # 直连 404 会被报成"发布方没提供安装包"，而真实原因可能是配额用尽。
          # 查资产编号失败时，"缺包"与"请求失败"必须分开：现在收敛成
          # "正文种类 -> 失败原因"的映射函数（两侧同名同形），
          # 缺包=missing、文件在里面但编号取不出来=bad-content、别的=network。
          # 这里盯结构在不在；映射出来的结论对不对，由门禁 10 的跨端比对兜底。
          if ($ps -notmatch 'function\s+Get-AssetFailureFromScope') { Write-Host 'Win 侧缺少"正文种类 -> 失败原因"的映射'; $fail = 1 }
          if ($sh -notmatch 'asset_failure_from_scope\(\)') { Write-Host 'Mac 侧缺少"正文种类 -> 失败原因"的映射'; $fail = 1 }
          if ($ps -notmatch '"release"\s*\{\s*return\s*"missing"') { Write-Host 'Win 侧的失败原因映射里没有"缺包"这一档'; $fail = 1 }
          if ($sh -notmatch 'release\)\s*(echo|printf)\s*"missing"') { Write-Host 'Mac 侧的失败原因映射里没有"缺包"这一档'; $fail = 1 }
          if ($ps -notmatch '"release-bad-id"\s*\{\s*return\s*"bad-content"') { Write-Host 'Win 侧的失败原因映射里没有"编号取不出来"这一档'; $fail = 1 }
          if ($sh -notmatch 'release-bad-id\)\s*(echo|printf)\s*"bad-content"') { Write-Host 'Mac 侧的失败原因映射里没有"编号取不出来"这一档'; $fail = 1 }
          if ($fail) { exit 1 }
          Write-Host '契约常量与变量集通过'

      - name: 门禁 7：AGENTS.md 体量上限
        shell: pwsh
        run: |
          # 这份文件每次会话都注入上下文，必须有天花板。量的是 git 里的 blob，
          # 不受检出时 LF/CRLF 影响，本地与 CI 结果一致。
          $limit = 48 * 1024
          $size = [int](git cat-file -s HEAD:AGENTS.md)
          Write-Host ("AGENTS.md 当前 {0} 字节，上限 {1} 字节（48 KB）" -f $size, $limit)
          if ($size -gt $limit) {
            Write-Host "AGENTS.md 超限。它每次会话都会注入上下文——请先精简（合并重复表述、把细节指向权威条目）再提交。"
            exit 1
          }

      - name: 门禁 8：配图一致性与合规
        shell: pwsh
        run: |
          $fail = 0
          $svgs = @(Get-ChildItem 'assets/readme' -Filter *.svg -File | Sort-Object Name)
          if ($svgs.Count -eq 0) { Write-Host 'assets/readme 里没有 SVG'; exit 1 }
          foreach ($f in $svgs) {
            $base = $f.Name -replace '\.en\.svg$', '' -replace '\.svg$', ''
            foreach ($p in @("assets/readme/$base.svg", "assets/readme/$base.en.svg")) {
              if (-not (Test-Path $p)) { Write-Host ("配图不成对，缺少：{0}" -f $p); $fail = 1 }
            }
            $t = Get-Content $f.FullName -Raw -Encoding UTF8
            foreach ($bad in @('<script', '<foreignObject', 'xlink:href', 'href="http', 'url(http')) {
              if ($t -match [regex]::Escape($bad)) { Write-Host ("{0} 含不允许的内容：{1}" -f $f.Name, $bad); $fail = 1 }
            }
            foreach ($need in @('viewBox=', '<title', '<desc')) {
              if ($t -notmatch [regex]::Escape($need)) { Write-Host ("{0} 缺少 {1}" -f $f.Name, $need); $fail = 1 }
            }
            # 合法性：SVG 必须是能解析的 XML。手改坐标时最容易漏一个引号或尖括号，
            # 而浏览器只会画出半张图、不报错——只有解析一下才拦得住。
            try { [xml]$null = $t } catch {
              Write-Host ("{0} 不是合法 XML：{1}" -f $f.Name, $_.Exception.Message)
              $fail = 1
            }
          }
          # 英文图里不许残留中文。这类残留靠人眼看不见：一张图十几行字，翻译时漏一行，
          # 读的人只会在自己恰好看到那一行时才发现；而它是「配图没翻译完」的直接证据。
          # 中文图里有英文是正常的（命令、路径、变量名），所以只查 .en.svg 一侧。
          $cjk = [regex]'[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]'
          foreach ($f in $svgs) {
            if ($f.Name -notmatch '\.en\.svg$') { continue }
            $t = Get-Content $f.FullName -Raw -Encoding UTF8
            foreach ($m in [regex]::Matches($t, '>(?<body>[^<]*)<')) {
              $body = $m.Groups['body'].Value.Trim()
              if ($body -and $cjk.IsMatch($body)) {
                Write-Host ("英文配图里有中文：{0} -> {1}" -f $f.Name, $body)
                $fail = 1
              }
            }
          }
          # 文字不许越出画布右侧。英文标题比中文长，同样的 x 起点会顶出去，
          # 被裁掉的部分在浏览器里直接看不见——不报错，只是少了字。
          function Measure-TextWidth([string]$s, [double]$size) {
            $w = 0.0
            foreach ($ch in $s.ToCharArray()) { if ([int]$ch -gt 0x2E80) { $w += 1.0 } else { $w += 0.5 } }
            return $w * $size
          }
          foreach ($f in $svgs) {
            $t = Get-Content $f.FullName -Raw -Encoding UTF8
            $doc = [xml]$t
            $vb = $doc.svg.viewBox -split '\s+'
            $canvasW = [double]$vb[2]
            foreach ($node in (Select-Xml -Xml $doc -XPath "//*[local-name()='text']" | ForEach-Object { $_.Node })) {
              $body = $node.InnerText
              if ([string]::IsNullOrWhiteSpace($body)) { continue }
              if (-not $node.x) { continue }
              $x = [double]$node.x
              $size = if ($node.'font-size') { [double]$node.'font-size' } else { 16.0 }
              $w = Measure-TextWidth $body $size
              $right = if ($node.'text-anchor' -eq 'middle') { $x + $w / 2 } elseif ($node.'text-anchor' -eq 'end') { $x } else { $x + $w }
              if ($right -gt $canvasW - 2) {
                Write-Host ("{0} 有文字越出画布右侧：{1}（到 ~{2}，画布宽 {3}）" -f $f.Name, $body, [int]$right, $canvasW)
                $fail = 1
              }
            }
          }
          $sets = @{}
          foreach ($f in 'README.md', 'README.en.md') {
            $t = Get-Content $f -Raw -Encoding UTF8
            $imgs = @([regex]::Matches($t, '<img\s+src="\./assets/readme/([^"]+)"[^>]*>'))
            if ($imgs.Count -eq 0) { Write-Host ("{0} 没有引用任何配图" -f $f); $fail = 1 }
            $refs = @()
            foreach ($m in $imgs) {
              $refs += $m.Groups[1].Value
              if ($m.Value -notmatch 'alt="[^"]+"') { Write-Host ("{0} 的配图缺 alt 文本：{1}" -f $f, $m.Groups[1].Value); $fail = 1 }
            }
            $sets[$f] = $refs
          }
          if ($sets['README.md'].Count -ne $sets['README.en.md'].Count) { Write-Host '两份 README 引用的配图数量不一致'; $fail = 1 }
          foreach ($r in $sets['README.md']) {
            if ($sets['README.en.md'] -notcontains ($r -replace '\.svg$', '.en.svg')) { Write-Host ("英文版没有引用对应的 {0}" -f ($r -replace '\.svg$', '.en.svg')); $fail = 1 }
          }
          # 不许有孤儿：assets/readme 里每张中文图都必须被中文 README 引用（否则就是没人看又没人删的堆积）
          foreach ($f in $svgs) {
            if ($f.Name -match '\.en\.svg$') { continue }
            if ($sets['README.md'] -notcontains $f.Name) { Write-Host ("中文 README 没有引用 {0}" -f $f.Name); $fail = 1 }
          }
          # 中英配图除文字外结构一致：元素种类序列与 <g id> 序列必须相同
          # （同一张图只改一侧、落下另一侧时拦住；文字允许因翻译长度不同而位移，故只比结构）
          foreach ($f in Get-ChildItem 'assets/readme/*.svg' | Where-Object { $_.Name -notmatch '\.en\.svg$' }) {
            $a = [xml](Get-Content $f.FullName -Raw -Encoding UTF8)
            $b = [xml](Get-Content ($f.FullName -replace '\.svg$', '.en.svg') -Raw -Encoding UTF8)
            $ta = @(Select-Xml -Xml $a -XPath '//*' | ForEach-Object { $_.Node.LocalName } | Sort-Object) -join ','
            $tb = @(Select-Xml -Xml $b -XPath '//*' | ForEach-Object { $_.Node.LocalName } | Sort-Object) -join ','
            if ($ta -ne $tb) { Write-Host ("中英配图元素结构不一致：{0}" -f $f.Name); $fail = 1 }
            $ga = @(Select-Xml -Xml $a -XPath "//*[local-name()='g' and @id]" | ForEach-Object { $_.Node.id }) -join ','
            $gb = @(Select-Xml -Xml $b -XPath "//*[local-name()='g' and @id]" | ForEach-Object { $_.Node.id }) -join ','
            if ($ga -ne $gb) { Write-Host ("中英配图分组结构不一致：{0}" -f $f.Name); $fail = 1 }
          }
          # 图例的间距必须严格相等。判据不是"看着差不多"，而是量出来的几何事实：
          # 每个图标在自己的格子里居中，所以「图标中心 → 文字起点」对每一项都应相等；
          # 相邻两项之间「文字右沿 → 下一图标中心」也应相等。
          # 这条挡住的是一类真实缺陷：横杠用 em dash 字形画会偏下且占满全宽，
          # 于是它和文字的间距比别的项窄，而且看着像没对齐——肉眼能看出，机器却没查。
          function Get-TextW([string]$s, [double]$size) {
            $w = 0.0
            foreach ($ch in $s.ToCharArray()) { if ([int]$ch -gt 0x2E80) { $w += 1.0 } else { $w += 0.55 } }
            return $w * $size
          }
          foreach ($f in $svgs) {
            $doc = [xml](Get-Content $f.FullName -Raw -Encoding UTF8)
            $lg = Select-Xml -Xml $doc -XPath "//*[local-name()='g' and @id='legend']"
            if (-not $lg) { continue }
            $nodes = @($lg.Node.ChildNodes | Where-Object { $_.NodeType -eq 'Element' })
            $iconCenters = @()
            $labelXs = @()
            foreach ($n in $nodes) {
              if ($n.LocalName -eq 'text' -and $n.y -eq '126') { $labelXs += [double]$n.x }
              elseif ($n.LocalName -eq 'text') { $iconCenters += [double]$n.x }
              elseif ($n.LocalName -eq 'circle') { $iconCenters += [double]$n.cx }
              elseif ($n.LocalName -eq 'rect') { $iconCenters += ([double]$n.x + [double]$n.width / 2) }
            }
            if ($iconCenters.Count -ne $labelXs.Count -or $labelXs.Count -lt 2) { continue }
            # 图标 → 文字：应为同一常数
            $d1 = @()
            for ($i = 0; $i -lt $labelXs.Count; $i++) { $d1 += [math]::Round($labelXs[$i] - $iconCenters[$i], 1) }
            if (($d1 | Select-Object -Unique).Count -ne 1) {
              Write-Host ("{0} 图例的图标与文字间距不一致：{1}" -f $f.Name, ($d1 -join ' '))
              $fail = 1
            }
            # 文字 → 下一图标：也应为同一常数
            $d2 = @()
            $labels = @($nodes | Where-Object { $_.LocalName -eq 'text' -and $_.y -eq '126' })
            for ($i = 0; $i -lt $labels.Count - 1; $i++) {
              $right = [double]$labels[$i].x + (Get-TextW $labels[$i].InnerText 20)
              $d2 += [math]::Round($iconCenters[$i + 1] - $right, 0)
            }
            if (($d2 | Select-Object -Unique).Count -ne 1) {
              Write-Host ("{0} 图例的项间距不一致：{1}" -f $f.Name, ($d2 -join ' '))
              $fail = 1
            }
          }
          # 表格里的标记必须垂直居中在所在行。这一条挡的是真实缺陷：
          # 用 <text> 画 ± 和 em dash 时，浏览器按字形基线摆，± 偏上、— 偏下，
          # 而同格的圆点是 <circle cy> 真居中——同一行里三种垂直位置，肉眼一看就乱。
          # 判据是量出来的几何中心，不是"看着还行"。
          foreach ($f in $svgs) {
            $doc = [xml](Get-Content $f.FullName -Raw -Encoding UTF8)
            # 行中心 = 两条相邻横线之间的中点。横线住在 row-lines 与 grid 两个组里，
            # 且「日常/维护」那条粗线也是行边界——把两组的横线都收进来再排序，天然就是
            # 每一行的上下边。不写死任何 y 值：改了行高这条判据自动跟上。
            $lines = @()
            foreach ($gid in @('row-lines', 'grid')) {
              $g = Select-Xml -Xml $doc -XPath "//*[local-name()='g' and @id='$gid']"
              if (-not $g) { continue }
              foreach ($p in $g.Node.ChildNodes) {
                if ($p.LocalName -ne 'path') { continue }
                foreach ($mm in [regex]::Matches([string]$p.d, 'M56 (\d+)H1144')) { $lines += [int]$mm.Groups[1].Value }
              }
            }
            $lines = @($lines | Sort-Object -Unique)
            if ($lines.Count -lt 2) { continue }
            $bands = @()
            for ($i = 0; $i -lt $lines.Count - 1; $i++) {
              # 行高约 40，表头那条带更高；只把像「行」的带当候选
              $h = $lines[$i + 1] - $lines[$i]
              if ($h -ge 30 -and $h -le 50) { $bands += ($lines[$i] + $h / 2) }
            }
            if ($bands.Count -eq 0) { continue }
            foreach ($n in (Select-Xml -Xml $doc -XPath "//*[local-name()='g' and @id='marks']//*" | ForEach-Object { $_.Node })) {
              $top = $null; $bot = $null
              if ($n.LocalName -eq 'circle') { $cy = [double]$n.cy; $r = [double]$n.r; $top = $cy - $r; $bot = $cy + $r }
              elseif ($n.LocalName -eq 'path') {
                $d = [string]$n.d
                $ys = @()
                $parts = [regex]::Matches($d, '[MLHVACZ]|-?\d+\.?\d*') | ForEach-Object { $_.Value }
                $k = 0
                while ($k -lt $parts.Count) {
                  switch ($parts[$k]) {
                    'M' { $ys += [double]$parts[$k + 2]; $k += 3 }
                    'L' { $ys += [double]$parts[$k + 2]; $k += 3 }
                    'V' { $ys += [double]$parts[$k + 1]; $k += 2 }
                    'H' { $k += 2 }
                    'A' { $ys += [double]$parts[$k + 6]; $k += 8 }
                    default { $k += 1 }
                  }
                }
                if ($ys.Count) { $top = ($ys | Measure-Object -Minimum).Minimum; $bot = ($ys | Measure-Object -Maximum).Maximum }
              }
              elseif ($n.LocalName -eq 'text' -and $n.'dominant-baseline' -eq 'central') {
                $cy = [double]$n.y; $size = [double]$n.'font-size'; $top = $cy - $size / 2; $bot = $cy + $size / 2
              }
              if ($null -eq $top) { continue }
              $mid = ($top + $bot) / 2
              $nearest = ($bands | Sort-Object { [math]::Abs($_ - $mid) })[0]
              if ([math]::Abs($mid - $nearest) -gt 1.5) {
                Write-Host ("{0} 有标记没在行里居中：中心 {1}，最近的行中心 {2}" -f $f.Name, [math]::Round($mid, 1), $nearest)
                $fail = 1
              }
            }
          }
          if ($fail) { exit 1 }
          Write-Host ("配图一致性通过（{0} 个 SVG，中英各引用 {1} 张）" -f $svgs.Count, $sets['README.md'].Count)

      - name: 门禁 9：文件模式
        shell: pwsh
        run: |
          # macOS 靠可执行位双击运行，Windows 侧相反。模式丢了只会在用户机器上炸，
          # 本地编辑器与 git 都不会提醒——所以按 git 索引逐条查。
          # 同样写死 core.quotepath=false：转义后的中文名走不到上面的正则，会被静默跳过（虚假通过）。
          # 还要把解码统一到 UTF-8：中文 Windows 默认按 ANSI(GBK) 解码，中文名成乱码，
          # 正则匹配不到，同样会被静默跳过（还是虚假通过，只是原因不同）。
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $fail = 0
          foreach ($line in (git -c core.quotepath=false ls-files -s)) {
            $p = $line -split '\s+'
            $mode = $p[0]; $path = $p[3]
            if (($path -match '^mac/.*\.(sh|command)$') -and ($mode -ne '100755')) { Write-Host ("应为可执行 100755：{0}（当前 {1}）" -f $path, $mode); $fail = 1 }
            if (($path -match '^win/.*\.(cmd|ps1)$') -and ($mode -ne '100644')) { Write-Host ("不应可执行 100644：{0}（当前 {1}）" -f $path, $mode); $fail = 1 }
          }
          if ($fail) { exit 1 }
          Write-Host '文件模式通过'

      - name: 门禁 10：功能自检
        shell: pwsh
        run: |
          # 静态门禁保"不变形"，这道保"行为对"：纯函数、hook 成对护栏、
          # 归属判定、注入核对回收往返、快照还原。失败返回非零。
          # 输出留在内存里就够了：不往仓库目录写临时文件（那会污染工作区，
          # 也可能被误提交）。要留档就用 CI 的日志。
          # 先把环境打出来：远端失败时，宿主版本、工作目录、bash 位置这三样决定排查方向。
          Write-Host ("宿主: {0}" -f $PSVersionTable.PSVersion.ToString())
          Write-Host ("工作目录: {0}" -f (Get-Location).Path)
          $bashPath = (Get-Command bash -ErrorAction SilentlyContinue).Source
          Write-Host ("bash: {0}" -f $(if ($bashPath) { $bashPath } else { '找不到' }))
          # Windows 上 bash 可能指向 WSL 的空壳（没装发行版时跑什么都说找不到文件）。
          # 那不是 Mac 自检真的失败，说清楚能省掉一次误判。
          if ($env:OS -eq 'Windows_NT') {
            Write-Host '提示：Windows 上跑 Mac 自检需要可用的 bash（Git Bash 或装了发行版的 WSL）。'
            Write-Host '      若 bash 指向 C:\WINDOWS\system32\bash.exe 且没有发行版，这一步会失败。'
          }
          $winOut = pwsh -NoProfile -File tests/test-win-pure.ps1
          $winRc = $LASTEXITCODE
          $winOut | Write-Host
          if ($winRc -ne 0) { Write-Host ("Win 功能自检失败，退出码 {0}" -f $winRc); exit 1 }
          $macOut = bash mac/envproxy.sh self-test
          $macRc = $LASTEXITCODE
          $macOut | Write-Host
          if ($macRc -ne 0) { Write-Host ("Mac 功能自检失败，退出码 {0}" -f $macRc); exit 1 }
          # 资产解析契约：同一个应答，两边必须给出同一个结论。
          # 文本层面的门禁看不出这种漂移：同一个应答，
          # 一边继续更新、一边说"这一版没提供安装包"（冤枉维护者）。
          # 所以要把两边的实际结论互相比一次（用例在 tests/asset-cases.txt）。
          $winContract = @($winOut | Where-Object { $_ -like 'contract *' })
          $macContract = @($macOut | Where-Object { $_ -like 'contract *' })
          if ($winContract.Count -eq 0 -or $macContract.Count -eq 0) {
            Write-Host '资产契约没有跑到：两侧都应输出 contract 行'; exit 1
          }
          if ($winContract.Count -ne $macContract.Count) {
            Write-Host ("资产契约两侧用例数对不上：win {0} / mac {1}" -f $winContract.Count, $macContract.Count); exit 1
          }
          for ($i = 0; $i -lt $winContract.Count; $i++) {
            if ($winContract[$i] -ne $macContract[$i]) {
              Write-Host '资产契约两侧结论不一致：'
              Write-Host ("  win: {0}" -f $winContract[$i])
              Write-Host ("  mac: {0}" -f $macContract[$i])
              exit 1
            }
          }
          Write-Host ("资产契约 {0} 条用例，两侧结论一致。" -f $winContract.Count)
          # 入口的参数与退出码同样是行为契约：两侧必须给出同一个退出码。
          # 只比资产解析的话，入口守卫的漂移就没人看得见——
          # 而"合法用法被当成用法错误拒掉"正是这一类。
          $winEntry = @($winOut | Where-Object { $_ -like 'entry *' })
          $macEntry = @($macOut | Where-Object { $_ -like 'entry *' })
          if ($winEntry.Count -eq 0 -or $macEntry.Count -eq 0) {
            Write-Host '入口契约没有跑到：两侧都应输出 entry 行'; exit 1
          }
          if ($winEntry.Count -ne $macEntry.Count) {
            Write-Host ("入口契约两侧用例数对不上：win {0} / mac {1}" -f $winEntry.Count, $macEntry.Count); exit 1
          }
          for ($i = 0; $i -lt $winEntry.Count; $i++) {
            if ($winEntry[$i] -ne $macEntry[$i]) {
              Write-Host '入口契约两侧结论不一致：'
              Write-Host ("  win: {0}" -f $winEntry[$i])
              Write-Host ("  mac: {0}" -f $macEntry[$i])
              exit 1
            }
          }
          Write-Host ("入口契约 {0} 条用例，两侧退出码一致。" -f $winEntry.Count)
          Write-Host '功能自检通过'

  powershell51:
    # 用户真实环境是系统自带的 PowerShell 5.1，而 ubuntu 上的 pwsh 是 7。
    # 两边都解析一遍：只靠 7 的话，7 独有的语法能过 CI、到用户机报语法错。
    runs-on: windows-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: 门禁 2b：ps1 语法检查（PowerShell 5.1）
        shell: powershell
        run: |
          # 用户真实环境是系统自带的 5.1：入口与每个库都要在 5.1 下解析一遍。
          Write-Host ("宿主: PowerShell {0}" -f $PSVersionTable.PSVersion.ToString())
          Write-Host ("工作目录: {0}" -f (Get-Location).Path)
          Write-Host ("看到 {0} 个 ps1" -f @(Get-ChildItem 'win' -Filter *.ps1 -File -Recurse).Count)
          foreach ($f in @(Get-ChildItem 'win' -Filter *.ps1 -File -Recurse)) {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count) { Write-Host ("{0} 在 5.1 下解析失败：" -f $f.Name); $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          }
          # 自检的输出逐行打出来：只报一句"失败"时，远端根本看不出是哪条断言挂了。
          powershell -NoProfile -File tests/test-win-pure.ps1
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Host ("Win 功能自检（5.1）失败，退出码 {0}" -f $rc); exit 1 }
          Write-Host '5.1 语法与功能自检通过'
