name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: sh 语法检查（与 AGENTS.md 第 1 条同款）
        run: |
          for f in mac/envproxy.sh mac/locator.sh mac/install.sh mac/stop.sh mac/uninstall.sh mac/status.sh mac/update.sh; do
            bash -n "$f" || exit 1
          done

      - name: ps1 语法检查（与 AGENTS.md 第 2 条同款）
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile('win/envproxy.ps1', [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs | ForEach-Object { $_.Message }; exit 1 }

      - name: 编码红线（与 AGENTS.md 第 3 条同款）
        run: |
          # 这两条都是"编辑器保存时悄悄违反"的类型，所以让 CI 当判据，不靠人记。
          if ! head -c 3 win/envproxy.ps1 | od -An -tx1 | tr -d ' \n' | grep -qx efbbbf; then
            echo "win/envproxy.ps1 缺少 UTF-8 BOM（无 BOM 时中文系统 PowerShell 5.1 会按 ANSI 读，直接语法报错）"
            exit 1
          fi
          for f in mac/*.sh; do
            if head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -qx efbbbf; then
              echo "$f 不应带 BOM（BOM 会顶掉 shebang，脚本无法执行）"
              exit 1
            fi
            if grep -q $'\r' "$f"; then
              echo "$f 必须是 LF 行尾"
              exit 1
            fi
          done
          echo "编码红线通过"

      - name: 文档目录与标题一致（与 AGENTS.md 第 4 条同款）
        run: node tools/sync-toc.mjs README.md README.en.md --check

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: 标签与 VERSION 一致
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG 与 VERSION $VER 不一致，拒绝发布。"
            exit 1
          fi

      - name: 建 Release（幂等，已存在则跳过）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          elif [ -f "release-notes/$TAG.md" ]; then
            gh release create "$TAG" --notes-file "release-notes/$TAG.md" --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
