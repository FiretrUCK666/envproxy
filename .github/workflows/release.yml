name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  # 门禁只有一处定义：check.yml。发版前先跑同一批（含安装包内容与文档一致性）。
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 同一标签的两次发版互斥：串行排队，不取消（发版中途取消会留半截资产）。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # 国内镜像仓库（Gitee）：维护者建好镜像仓库后填 "<用户名>/<仓库名>"，留空 = 未启用（跳过同步）。
      # 这个值必须与两侧脚本里的 GiteeMirrorRepo / GITEE_MIRROR_REPO 完全一致：
      # 客户端按它去查版本、这里按它去上传，口径分家会让用户端回退到一个空仓库，门禁 6 负责拦下漂移。
      GITEE_REPO: ""
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      # 先验钥匙：token 无效/过期时在这里就报清楚，而不是打包半天后在上传那步哑火。
      - name: 预检发布钥匙
        run: |
          command -v gh >/dev/null 2>&1 || { echo "缺少 gh，无法发布。"; exit 1; }
          gh api user --jq .login >/dev/null 2>&1 || { echo "RELEASE_TOKEN 无效或过期：请维护者换发 Secrets 里那一个值（工作流文件不用动）。"; exit 1; }
          echo "发布钥匙有效。"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: 标签与 VERSION 一致，且中文发版说明已随版提交
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "标签 $TAG 与 VERSION $VER 不一致，拒绝发布。"
            exit 1
          fi
          if [ ! -f "release-notes/$TAG.md" ]; then
            echo "缺 release-notes/$TAG.md：发版说明与版本一起提交，拒绝发布。"
            exit 1
          fi
          echo "标签、版本、发版说明齐备。"

      - name: 打安装包（内容由 .gitattributes 的 export-ignore 声明）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          # 只有分平台包：完整内容减去另一平台目录；更新入口按平台各取各的包。
          git archive --format=zip    -o dist/EnvProxy-win.zip "$TAG" win README.md README.en.md LICENSE VERSION release-notes assets || { echo "打 Win 包失败"; exit 1; }
          git archive --format=tar.gz -o dist/EnvProxy-mac.tar.gz "$TAG" mac README.md README.en.md LICENSE VERSION release-notes assets || { echo "打 Mac 包失败"; exit 1; }
          ls -l dist

      - name: 校验安装包（与仓库逐字节一致、编码红线在容器里没被改）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          # 期望清单从仓库现场算：ls-files 减 export-ignore，再减对方平台目录。
          # 与门禁 4 同源，不在两处各写一份名单。
          $ignRaw = @(Select-String -Path .gitattributes -Pattern '^/(\S+?)\s+export-ignore' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $inRepo = @(git -c core.quotepath=false ls-files | Sort-Object)
          function RepoSet([string]$skipDir) {
            return @($inRepo | Where-Object {
              $p = $_; $hit = $false
              foreach ($g in $ignRaw) {
                if ($g.EndsWith('/')) { if ($p.StartsWith($g)) { $hit = $true; break } }
                elseif ($p -eq $g) { $hit = $true; break }
              }
              (-not $hit) -and ($p -notlike ($skipDir + '/*'))
            } | Sort-Object)
          }
          function Test-OnePackage([string]$pkgPath, [string]$skipDir, [string]$ownEntry) {
            $d = Join-Path $tmp ([System.IO.Path]::GetRandomFileName())
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            if ($pkgPath -like '*.tar.gz') {
              & tar -xzf $pkgPath -C $d
              if ($LASTEXITCODE -ne 0) { Write-Host ("分包解压失败：" + $pkgPath); return $false }
            } else {
              Expand-Archive -Path $pkgPath -DestinationPath $d -Force
            }
            $ok = $true
            $have = @(Get-ChildItem $d -Recurse -File | ForEach-Object { $_.FullName.Substring($d.Length).TrimStart('/','\').Replace('\','/') } | Sort-Object)
            $want = RepoSet $skipDir
            $dd = Compare-Object $want $have
            if ($dd) { Write-Host ("分包内容不对：" + $pkgPath); $dd | ForEach-Object { Write-Host ("  {0} {1}" -f $_.SideIndicator, $_.InputObject) }; $ok = $false }
            foreach ($r in $have) {
              if ($r -match '^(win|mac)/monitor/') { Write-Host ("运行时目录进了分包：" + $r); $ok = $false; continue }
              $rel = $r.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path -LiteralPath $rel)) { Write-Host ("分包里有仓库没有的文件：" + $r); $ok = $false; continue }
              $a = (Get-FileHash (Join-Path $d $rel) -Algorithm SHA256).Hash
              $b = (Get-FileHash $rel -Algorithm SHA256).Hash
              if ($a -ne $b) { Write-Host ("分包与仓库字节不一致：" + $r); $ok = $false }
            }
            if ($have -notcontains $ownEntry) { Write-Host ("分包缺自己平台入口：" + $ownEntry); $ok = $false }
            $eb = [System.IO.File]::ReadAllBytes((Join-Path $d ($ownEntry.Replace('/', [System.IO.Path]::DirectorySeparatorChar))))
            if ($ownEntry -like '*.ps1') {
              if (-not ($eb[0] -eq 0xEF -and $eb[1] -eq 0xBB -and $eb[2] -eq 0xBF)) { Write-Host '交付的入口丢了 UTF-8 BOM'; $ok = $false }
            } else {
              if ($eb[0] -eq 0xEF -and $eb[1] -eq 0xBB -and $eb[2] -eq 0xBF) { Write-Host '交付的入口带了 BOM'; $ok = $false }
              if ([System.Text.Encoding]::UTF8.GetString($eb).Contains("`r`n")) { Write-Host '交付的入口被改成 CRLF'; $ok = $false }
            }
            Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue
            return $ok
          }
          if (-not (Test-OnePackage 'dist/EnvProxy-win.zip' 'mac' 'win/envproxy.ps1')) { $fail = 1 }
          if (-not (Test-OnePackage 'dist/EnvProxy-mac.tar.gz' 'win' 'mac/envproxy.sh')) { $fail = 1 }

          if ($fail) { exit 1 }
          Write-Host '安装包校验通过。'

      - name: 建 Release 并挂安装包（幂等：已存在则补齐资产）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：上传（覆盖）两个资产，并刷新发版说明。"
            gh release upload "$TAG" dist/EnvProxy-win.zip dist/EnvProxy-mac.tar.gz --clobber
            gh release edit "$TAG" --notes-file "release-notes/$TAG.md" --title "$TAG"
          else
            gh release create "$TAG" dist/EnvProxy-win.zip dist/EnvProxy-mac.tar.gz \
              --notes-file "release-notes/$TAG.md" --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: 自校验（两个资产都在、是最新、与本地一致，README 的下载直链才有效）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          command -v jq sha256sum awk curl >/dev/null 2>&1 || { echo "自校验缺工具（jq/sha256sum/awk/curl），装不上就判不了，请先修 runner。"; exit 1; }
          # gh release view 的 --json 字段集随版本变化（如 isLatest 老版本没有），只用最稳的 assets；
          # "是否最新"改从 releases/latest 反查：重建旧标签时直链仍指新版，此时必须拒绝。
          JSON="$(gh release view "$TAG" --json assets)" || { echo "读取 Release 失败：$TAG"; exit 1; }
          for want in EnvProxy-win.zip EnvProxy-mac.tar.gz; do
            SIZE="$(printf '%s' "$JSON" | jq -r --arg w "$want" '.assets[] | select(.name==$w) | .size // empty')"
            if [ -z "$SIZE" ]; then
              echo "资产缺失：$want（README 的下载直链与更新入口都会失效）"
              exit 1
            fi
            if [ "$SIZE" -le 0 ]; then
              echo "资产为空：$want（上传没写完）"
              exit 1
            fi
            DIGEST="$(printf '%s' "$JSON" | jq -r --arg w "$want" '.assets[] | select(.name==$w) | .digest // empty')"
            if [ -n "$DIGEST" ]; then
              LOCAL="$(sha256sum "dist/$want" | awk '{print $1}')"
              if [ "${DIGEST#sha256:}" != "$LOCAL" ]; then
                echo "资产摘要与本地不一致：$want（传输或存储被改写）"
                exit 1
              fi
            else
              echo "注意：$want 取不到摘要字段（gh 太老），跳过摘要比对，后面的直链下载校验仍会兜底。"
            fi
          done
          # 取不到"最新版"最常见的成因是这个 Release 还停在草稿：草稿对外不可见，
          # releases/latest 会直接 404，于是直链和更新入口一起失效。报错必须点出这一条，
          # 否则只看到"读取失败"，还得翻日志才知道是草稿。
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" || {
            echo "读取最新版失败：多数情况是 $TAG 还停在草稿（草稿对外不可见）；也可能是钥匙没权限读 Releases，或正在用补漏流程重跑旧版。挨个确认。"
            exit 1
          }
          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "直链最新版是 $LATEST_TAG，不是 $TAG：README 的下载直链会指向别的版本，请确认后再发。"
            exit 1
          fi
          # API 里有 ≠ 直链能下到（CDN 边缘可能还留着旧字节）：真把两条直链下回来比摘要。
          # 刚上传完边缘没刷新完是常事，等几轮；还对不上就红——绝不放行"看起来发了、实际下到旧东西"的版本。
          for want in EnvProxy-win.zip EnvProxy-mac.tar.gz; do
            ok=""
            for i in 1 2 3 4 5 6; do
              if curl -sL --max-time 60 -o "/tmp/envproxy-dl-$want" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$want" 2>/dev/null; then
                if [ "$(sha256sum "/tmp/envproxy-dl-$want" | awk '{print $1}')" = "$(sha256sum "dist/$want" | awk '{print $1}')" ]; then ok=1; break; fi
              fi
              sleep 30
            done
            rm -f "/tmp/envproxy-dl-$want" 2>/dev/null || true
            if [ -z "$ok" ]; then echo "直链 $want 下回来的东西与本地不一致（CDN 还没刷新或上传有问题），拒绝放行。"; exit 1; fi
          done
          echo "资产已就位且最新。"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # 国内镜像：墙内到不了 GitHub 的用户靠它拿到更新（客户端按源表逐源尝试，见 win/lib/update.ps1）。
      # 未启用是正常状态（镜像仓库还没建）：明确打一行日志说明，不算失败。
      # 但"配了地址却没配钥匙"必须当场红——那会让镜像悄悄停在旧版本，比不做镜像更危险：
      # 用户端会老老实实回退过来，拿到的却是几个月前的东西。
      - name: 同步到国内镜像（Gitee）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if [ -z "$GITEE_REPO" ]; then
            echo "未配置国内镜像仓库：跳过同步（官方源已照常发布）。"
            exit 0
          fi
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "配了 GITEE_REPO 却没有 GITEE_TOKEN：拒绝静默跳过。"
            echo "请在仓库 Secrets 里加上 GITEE_TOKEN（Gitee 私人令牌，勾 projects 权限）。"
            exit 1
          fi
          API="https://gitee.com/api/v5/repos/$GITEE_REPO"
          DL="https://gitee.com/$GITEE_REPO"
          # 先读仓库信息：既确认仓库真的可达，也拿到默认分支——创建发行版时 target_commitish 是必填项。
          # 三条读接口都带上 token：匿名配额是按出口 IP 共享的，而发布 runner 的 IP 是共享的，
          # 为了"确认仓库可达"去打匿名请求，恰恰是最容易被限流打掉的那一下——
          # 一旦 403，就会被误报成"仓库不存在"，把人指到完全错误的方向。
          REPO_JSON="$(curl -fsS --max-time 30 "$API?access_token=$GITEE_TOKEN" 2>/dev/null || true)"
          if [ -z "$REPO_JSON" ]; then
            echo "读不到 Gitee 仓库 $GITEE_REPO：确认它已建好、拼写与大小写都对、token 有效（403 也可能是限流）。"
            exit 1
          fi
          BRANCH="$(printf '%s' "$REPO_JSON" | jq -r '.default_branch // "master"')"
          # 幂等：发行版已存在就复用（重跑只补附件，不会重复建）。
          REL_ID="$(curl -fsS --max-time 30 "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$REL_ID" ]; then
            echo "在 Gitee 创建发行版 $TAG（目标分支 $BRANCH）..."
            REL_ID="$(curl -fsS --max-time 60 -X POST "$API/releases" \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=$TAG" \
              --data-urlencode "target_commitish=$BRANCH" \
              --data-urlencode "body@release-notes/$TAG.md" | jq -r '.id // empty')"
          fi
          if [ -z "$REL_ID" ]; then
            echo "Gitee 发行版创建失败：确认 token 勾了 projects 权限，且仓库是公开的。"
            exit 1
          fi
          for want in EnvProxy-win.zip EnvProxy-mac.tar.gz; do
            # 同名附件先删后传：Gitee 不接受同名重复上传，而重跑必须得到同一个结果。
            # 三处细节都是规范里写明的，写错会静默失效：
            #   列表默认分页 20 条 → 显式要满页（per_page=100），否则同名附件一多就查不到；
            #   同名的**全部**删掉 → 只删一条时，历史上删失败的残留会继续挡着上传；
            #   DELETE 的 access_token 在 **query** → 规范里 32/32 个 DELETE 端点都声明在 query，
            #     放请求体是查无此用法，会被 || true 静默吞掉。
            for old_id in $(curl -fsS --max-time 30 "$API/releases/$REL_ID/attach_files?per_page=100&access_token=$GITEE_TOKEN" 2>/dev/null \
              | jq -r --arg w "$want" '.[] | select(.name==$w) | .id' 2>/dev/null || true); do
              curl -fsS --max-time 30 -X DELETE "$API/releases/$REL_ID/attach_files/$old_id?access_token=$GITEE_TOKEN" >/dev/null || true
            done
            echo "上传 $want ..."
            curl -fsS --max-time 180 -X POST "$API/releases/$REL_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@dist/$want" >/dev/null || { echo "上传失败：$want"; exit 1; }
          done
          # 自校验：从 Gitee 真下回来比摘要，与官方源那条同一条标准。
          # 用户端会照单全收镜像里的东西，所以"看起来同步了、实际下到旧东西"绝不放行。
          for want in EnvProxy-win.zip EnvProxy-mac.tar.gz; do
            ok=""
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 60 -o "/tmp/gitee-$want" "$DL/releases/download/$TAG/$want" 2>/dev/null; then
                if [ "$(sha256sum "/tmp/gitee-$want" | awk '{print $1}')" = "$(sha256sum "dist/$want" | awk '{print $1}')" ]; then ok=1; break; fi
              fi
              sleep 15
            done
            rm -f "/tmp/gitee-$want" 2>/dev/null || true
            if [ -z "$ok" ]; then echo "Gitee 上的 $want 与本地不一致，镜像没同步成功（用户端会拿到旧包）。"; exit 1; fi
          done
          echo "国内镜像已就位，且与本地逐字节一致。"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
