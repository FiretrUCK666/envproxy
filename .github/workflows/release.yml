name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: sh 语法检查（与 AGENTS.md 第 1 条同款）
        run: |
          for f in mac/envproxy.sh mac/locator.sh mac/install.sh mac/stop.sh mac/uninstall.sh mac/status.sh; do
            bash -n "$f" || exit 1
          done

      - name: ps1 语法检查（与 AGENTS.md 第 2 条同款）
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile('win/envproxy.ps1', [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs | ForEach-Object { $_.Message }; exit 1 }

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: 标签与 VERSION 一致
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG 与 VERSION $VER 不一致，拒绝发布。"
            exit 1
          fi

      - name: 建 Release（幂等，已存在则跳过）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
