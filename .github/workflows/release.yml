name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  # 门禁只有一处定义：check.yml。发版前先跑同一批（含安装包内容与文档一致性）。
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: 标签与 VERSION 一致，且中文发版说明已随版提交
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "标签 $TAG 与 VERSION $VER 不一致，拒绝发布。"
            exit 1
          fi
          if [ ! -f "release-notes/$TAG.md" ]; then
            echo "缺 release-notes/$TAG.md：发版说明与版本一起提交，拒绝发布。"
            exit 1
          fi
          echo "标签、版本、发版说明齐备。"

      - name: 打安装包（内容由 .gitattributes 的 export-ignore 声明）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          # 只有分平台包：完整内容减去另一平台目录；更新入口按平台各取各的包。
          git archive --format=zip    -o dist/EnvProxy-win.zip "$TAG" win README.md README.en.md LICENSE VERSION release-notes assets
          git archive --format=tar.gz -o dist/EnvProxy-mac.tar.gz "$TAG" mac README.md README.en.md LICENSE VERSION release-notes assets
          ls -l dist

      - name: 校验安装包（与仓库逐字节一致、编码红线在容器里没被改）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          # 期望清单从仓库现场算：ls-files 减 export-ignore，再减对方平台目录。
          # 与门禁 4 同源，不在两处各写一份名单。
          $ignRaw = @(Select-String -Path .gitattributes -Pattern '^/(\S+?)\s+export-ignore' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $inRepo = @(git -c core.quotepath=false ls-files | Sort-Object)
          function RepoSet([string]$skipDir) {
            return @($inRepo | Where-Object {
              $p = $_; $hit = $false
              foreach ($g in $ignRaw) {
                if ($g.EndsWith('/')) { if ($p.StartsWith($g)) { $hit = $true; break } }
                elseif ($p -eq $g) { $hit = $true; break }
              }
              (-not $hit) -and ($p -notlike ($skipDir + '/*'))
            } | Sort-Object)
          }
          function Test-OnePackage([string]$pkgPath, [string]$skipDir, [string]$ownEntry) {
            $d = Join-Path $tmp ([System.IO.Path]::GetRandomFileName())
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            if ($pkgPath -like '*.tar.gz') {
              & tar -xzf $pkgPath -C $d
              if ($LASTEXITCODE -ne 0) { Write-Host ("分包解压失败：" + $pkgPath); return $false }
            } else {
              Expand-Archive -Path $pkgPath -DestinationPath $d -Force
            }
            $ok = $true
            $have = @(Get-ChildItem $d -Recurse -File | ForEach-Object { $_.FullName.Substring($d.Length).TrimStart('/','\').Replace('\','/') } | Sort-Object)
            $want = RepoSet $skipDir
            $dd = Compare-Object $want $have
            if ($dd) { Write-Host ("分包内容不对：" + $pkgPath); $dd | ForEach-Object { Write-Host ("  {0} {1}" -f $_.SideIndicator, $_.InputObject) }; $ok = $false }
            foreach ($r in $have) {
              if ($r -match '^(win|mac)/monitor/') { Write-Host ("运行时目录进了分包：" + $r); $ok = $false; continue }
              $rel = $r.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path $rel)) { Write-Host ("分包里有仓库没有的文件：" + $r); $ok = $false; continue }
              $a = (Get-FileHash (Join-Path $d $rel) -Algorithm SHA256).Hash
              $b = (Get-FileHash $rel -Algorithm SHA256).Hash
              if ($a -ne $b) { Write-Host ("分包与仓库字节不一致：" + $r); $ok = $false }
            }
            if ($have -notcontains $ownEntry) { Write-Host ("分包缺自己平台入口：" + $ownEntry); $ok = $false }
            $eb = [System.IO.File]::ReadAllBytes((Join-Path $d ($ownEntry.Replace('/', [System.IO.Path]::DirectorySeparatorChar))))
            if ($ownEntry -like '*.ps1') {
              if (-not ($eb[0] -eq 0xEF -and $eb[1] -eq 0xBB -and $eb[2] -eq 0xBF)) { Write-Host '交付的入口丢了 UTF-8 BOM'; $ok = $false }
            } else {
              if ($eb[0] -eq 0xEF -and $eb[1] -eq 0xBB -and $eb[2] -eq 0xBF) { Write-Host '交付的入口带了 BOM'; $ok = $false }
              if ([System.Text.Encoding]::UTF8.GetString($eb).Contains("`r`n")) { Write-Host '交付的入口被改成 CRLF'; $ok = $false }
            }
            Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue
            return $ok
          }
          if (-not (Test-OnePackage 'dist/EnvProxy-win.zip' 'mac' 'win/envproxy.ps1')) { $fail = 1 }
          if (-not (Test-OnePackage 'dist/EnvProxy-mac.tar.gz' 'win' 'mac/envproxy.sh')) { $fail = 1 }

          if ($fail) { exit 1 }
          Write-Host '安装包校验通过。'

      - name: 建 Release 并挂安装包（幂等：已存在则补齐资产）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：上传（覆盖）两个资产，并刷新发版说明。"
            gh release upload "$TAG" dist/EnvProxy-win.zip dist/EnvProxy-mac.tar.gz --clobber
            gh release edit "$TAG" --notes-file "release-notes/$TAG.md" --title "$TAG"
          else
            gh release create "$TAG" dist/EnvProxy-win.zip dist/EnvProxy-mac.tar.gz \
              --notes-file "release-notes/$TAG.md" --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: 自校验（两个资产都在、是最新、与本地一致，README 的下载直链才有效）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          # gh release view 的 --json 字段集随版本变化（如 isLatest 老版本没有），只用最稳的 assets；
          # "是否最新"改从 releases/latest 反查：重建旧标签时直链仍指新版，此时必须拒绝。
          JSON="$(gh release view "$TAG" --json assets)" || { echo "读取 Release 失败：$TAG"; exit 1; }
          for want in EnvProxy-win.zip EnvProxy-mac.tar.gz; do
            SIZE="$(printf '%s' "$JSON" | jq -r --arg w "$want" '.assets[] | select(.name==$w) | .size // empty')"
            if [ -z "$SIZE" ]; then
              echo "资产缺失：$want（README 的下载直链与更新入口都会失效）"
              exit 1
            fi
            if [ "$SIZE" -le 0 ]; then
              echo "资产为空：$want（上传没写完）"
              exit 1
            fi
            DIGEST="$(printf '%s' "$JSON" | jq -r --arg w "$want" '.assets[] | select(.name==$w) | .digest // empty')"
            if [ -n "$DIGEST" ]; then
              LOCAL="$(sha256sum "dist/$want" | awk '{print $1}')"
              if [ "${DIGEST#sha256:}" != "$LOCAL" ]; then
                echo "资产摘要与本地不一致：$want（传输或存储被改写）"
                exit 1
              fi
            fi
          done
          # 取不到"最新版"最常见的成因是这个 Release 还停在草稿：草稿对外不可见，
          # releases/latest 会直接 404，于是直链和更新入口一起失效。报错必须点出这一条，
          # 否则只看到"读取失败"，还得翻日志才知道是草稿。
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" || {
            echo "读取最新版失败：请到 Releases 页面确认 $TAG 是不是停在草稿（草稿对外不可见，下载直链与更新入口都会失效）。"
            exit 1
          }
          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "直链最新版是 $LATEST_TAG，不是 $TAG：README 的下载直链会指向别的版本，请确认后再发。"
            exit 1
          fi
          echo "资产已就位且最新。"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
