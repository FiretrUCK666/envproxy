name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: sh 语法检查（与 AGENTS.md 第 1 条同款）
        run: |
          for f in mac/envproxy.sh mac/locator.sh mac/install.sh mac/stop.sh mac/uninstall.sh mac/status.sh mac/update.sh; do
            bash -n "$f" || exit 1
          done

      - name: ps1 语法检查（与 AGENTS.md 第 2 条同款）
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile('win/envproxy.ps1', [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs | ForEach-Object { $_.Message }; exit 1 }

      - name: 编码红线检查（与 AGENTS.md 硬性规范第 6、7 条同款）
        shell: pwsh
        run: |
          $fail = 0
          $b = [System.IO.File]::ReadAllBytes('win/envproxy.ps1')
          if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
            Write-Host 'win/envproxy.ps1 缺少 UTF-8 BOM'
            $fail = 1
          }
          $s = [System.IO.File]::ReadAllBytes('mac/envproxy.sh')
          if ($s[0] -eq 0xEF -and $s[1] -eq 0xBB -and $s[2] -eq 0xBF) {
            Write-Host 'mac/envproxy.sh 带了 BOM'
            $fail = 1
          }
          $text = [System.Text.Encoding]::UTF8.GetString($s)
          if ($text.Contains("`r`n")) {
            Write-Host 'mac/envproxy.sh 含 CRLF'
            $fail = 1
          }
          if ($fail) { exit 1 }
          Write-Host '编码红线通过'

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: 标签与 VERSION 一致
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG 与 VERSION $VER 不一致，拒绝发布。"
            exit 1
          fi

      - name: 建 Release（幂等，已存在则跳过）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          elif [ -f "release-notes/$TAG.md" ]; then
            gh release create "$TAG" --notes-file "release-notes/$TAG.md" --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
