<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="blockersTitle blockersDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="blockersTitle">Three Mac first-install hurdles</title>
  <desc id="blockersDesc">Three side-by-side hurdles. A blocked double-click is cleared with Open Anyway in Settings, and the terminal command always works; a lost executable bit comes back with one chmod, common for folders copied from Windows; the first-login prompt asking for Documents access just needs OK, and even Do Not Allow can be fixed with one install.</desc>

  <rect width="1200" height="380" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="70" font-size="32" font-weight="700" fill="#E9EFF8">Three Mac first-install hurdles</text>
  </g>

  <g id="boxes" fill="none" stroke="#2A3B58" stroke-width="1.5">
    <rect x="56" y="100" width="320" height="190" rx="12"/>
    <rect x="440" y="100" width="320" height="190" rx="12"/>
    <rect x="824" y="100" width="320" height="190" rx="12"/>
  </g>

  <g id="numbers" font-size="22" font-weight="700" fill="#33486B" text-anchor="middle">
    <text x="216" y="140">1</text>
    <text x="600" y="140">2</text>
    <text x="984" y="140">3</text>
  </g>

  <g id="labels">
    <text x="216" y="176" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Blocked launch</text>
    <text x="216" y="214" font-size="20" fill="#C7D3E3" text-anchor="middle">Open Anyway in Settings</text>
    <text x="216" y="248" font-size="18" fill="#94A6BE" text-anchor="middle">terminal command works</text>
    <text x="600" y="176" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Bit not executable</text>
    <text x="600" y="214" font-size="20" fill="#C7D3E3" text-anchor="middle">one chmod brings it back</text>
    <text x="600" y="248" font-size="18" fill="#94A6BE" text-anchor="middle">from Windows copies</text>
    <text x="984" y="176" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Documents prompt</text>
    <text x="984" y="214" font-size="20" fill="#C7D3E3" text-anchor="middle">clicking OK is enough</text>
    <text x="984" y="248" font-size="18" fill="#94A6BE" text-anchor="middle">denials can be fixed too</text>
  </g>

  <g id="footer">
    <text x="56" y="336" font-size="20" fill="#C7D3E3">Every hurdle has a way back: no reinstalling the tool, no disabling system protection.</text>
  </g>
</svg>
