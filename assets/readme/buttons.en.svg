    <text x="96" y="162" font-size="22" fill="#94A6BE" textLength="49.3" lengthAdjust="spacing">kept</text>
    <g data-cx="186.3"><path d="M179.3 155H193.3" fill="none" stroke="#94A6BE" stroke-width="3" stroke-linecap="round"/></g>
    <text x="213.3" y="162" font-size="22" fill="#94A6BE" textLength="86.2" lengthAdjust="spacing">cleared</text>
    <g data-cx="340.5"><circle cx="340.5" cy="155" r="7" fill="#7A8CA6"/></g>
    <text x="367.5" y="162" font-size="22" fill="#94A6BE" textLength="110.9" lengthAdjust="spacing">read-only</text>
    <g data-cx="519.4"><path d="M512.4 152 H526.4 M519.4 148 V162 M512.4 158 H526.4" fill="none" stroke="#C7D3E3" stroke-width="2.6" stroke-linecap="round"/></g>
    <text x="546.4" y="162" font-size="22" fill="#94A6BE" textLength="271" lengthAdjust="spacing">depends on proxy state</text>
  </g>

