<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">A six-row, five-column comparison table. The rows are the six menu items: install or repair, show status, stop the monitor, full restore, check for updates, and help. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a dot means read-only, and a plus-minus means it depends on whether you are currently behind the proxy. Install corrects the environment variables; stop clears the monitor and the variables while leaving start at login and the locator; full restore clears everything except the log; show status, check for updates and help change nothing at all.</desc>

  <rect width="1200" height="490" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="488.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="80" font-size="32" font-weight="700" fill="#E9EFF8">What each menu item affects</text>
    <text x="56" y="118" dominant-baseline="central" font-size="26" font-weight="700" fill="#34D399">✓</text>
    <text x="84" y="126" font-size="20" fill="#94A6BE">kept</text>
    <text x="164" y="126" font-size="26" font-weight="700" fill="#94A6BE">—</text>
    <text x="202" y="126" font-size="20" fill="#94A6BE">cleared</text>
    <circle cx="300" cy="119.5" r="4" fill="#7A8CA6"/>
    <text x="312" y="126" font-size="20" fill="#94A6BE">read-only</text>
    <text x="432" y="126" font-size="22" font-weight="700" fill="#C7D3E3">±</text>
    <text x="456" y="126" font-size="20" fill="#94A6BE">depends on the current state</text>
  </g>

  <g id="grid" fill="none" stroke-width="1.5">
    <path d="M200 156V434M380 156V434M560 156V434M740 156V434M920 156V434M1100 156V434" stroke="#2A3B58"/>
    <path d="M56 156H1144M56 314H1144M56 434H1144" stroke="#2A3B58"/>
    <path d="M56 194H1144" stroke="#33486B"/>
  </g>

  <g id="column-labels" font-size="20" fill="#C7D3E3" text-anchor="middle">
    <text x="290" y="182">Start at login</text>
    <text x="470" y="182">Monitor</text>
    <text x="650" y="182">Variables</text>
    <text x="830" y="182">Log</text>
    <text x="1010" y="182">Locator / path</text>
  </g>

  <g id="row-labels" font-size="21" fill="#E9EFF8">
    <text x="56" y="222">1 Install / Repair</text>
    <text x="56" y="262">2 Show status</text>
    <text x="56" y="302">3 Check for updates</text>
    <text x="56" y="342">4 Help</text>
    <text x="56" y="382">5 Stop monitor</text>
    <text x="56" y="422">6 Full restore</text>
  </g>

  <g id="row-lines" stroke="#2A3B58" stroke-width="1.5">
    <path d="M56 234H1144M56 274H1144M56 354H1144M56 394H1144"/>
  </g>

  <g id="kept" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">
    <text x="290" y="214" dominant-baseline="central">✓</text>
    <text x="470" y="214" dominant-baseline="central">✓</text>
    <text x="830" y="214" dominant-baseline="central">✓</text>
    <text x="1010" y="214" dominant-baseline="central">✓</text>
    <text x="290" y="374" dominant-baseline="central">✓</text>
    <text x="830" y="374" dominant-baseline="central">✓</text>
    <text x="1010" y="374" dominant-baseline="central">✓</text>
    <text x="830" y="414" dominant-baseline="central">✓</text>
  </g>

  <g id="by-state" font-size="26" font-weight="700" fill="#C7D3E3" text-anchor="middle">
    <text x="650" y="214">±</text>
  </g>

  <g id="cleared" font-size="26" font-weight="700" fill="#94A6BE" text-anchor="middle">
    <text x="470" y="374" dominant-baseline="central">—</text>
    <text x="650" y="374" dominant-baseline="central">—</text>
    <text x="290" y="414" dominant-baseline="central">—</text>
    <text x="470" y="414" dominant-baseline="central">—</text>
    <text x="650" y="414" dominant-baseline="central">—</text>
    <text x="1010" y="414" dominant-baseline="central">—</text>
  </g>

  <g id="read-only" fill="#7A8CA6">
    <circle cx="290" cy="254" r="4"/>
    <circle cx="470" cy="254" r="4"/>
    <circle cx="650" cy="254" r="4"/>
    <circle cx="830" cy="254" r="4"/>
    <circle cx="1010" cy="254" r="4"/>
    <circle cx="290" cy="294" r="4"/>
    <circle cx="470" cy="294" r="4"/>
    <circle cx="650" cy="294" r="4"/>
    <circle cx="830" cy="294" r="4"/>
    <circle cx="1010" cy="294" r="4"/>
    <circle cx="290" cy="334" r="4"/>
    <circle cx="470" cy="334" r="4"/>
    <circle cx="650" cy="334" r="4"/>
    <circle cx="830" cy="334" r="4"/>
    <circle cx="1010" cy="334" r="4"/>
  </g>
</svg>
