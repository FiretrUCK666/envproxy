    <path d="M187 155H207" fill="none" stroke="#94A6BE" stroke-width="3" stroke-linecap="round"/>
    <text x="226" y="162" font-size="22" fill="#94A6BE">cleared</text>
    <circle cx="355" cy="155" r="5.5" fill="#7A8CA6"/>
    <text x="384" y="162" font-size="22" fill="#94A6BE">read-only</text>
    <path d="M526 151H546M536 146V160M526 164H546" fill="none" stroke="#C7D3E3" stroke-width="2.8" stroke-linecap="round"/>
    <text x="565" y="162" font-size="22" fill="#94A6BE">depends on proxy state</text>
    <path d="M862 147A8.5 8.5 0 1 1 862 163M858.5 163L862 163L864.5 158.5" fill="none" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="891" y="162" font-size="22" fill="#94A6BE">rebuilt on update</text>
  </g>

