<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item touches</title>
  <desc id="buttonsDesc">A five by five grid. Rows are the five menu items, columns are start at login, the monitor process, the variables, the log, and the locator plus path record. A check means kept, a dash means removed, a dot means read only, a plus-minus means it follows whether a proxy is running right now. Install only corrects the variables; stop clears the monitor and the variables but keeps start at login and the locator; full restore clears everything except the log; status and update are read only.</desc>

  <rect width="1200" height="450" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="80" font-size="32" font-weight="700" fill="#E9EFF8">What each menu item touches</text>
    <text x="56" y="118" dominant-baseline="central" font-size="26" font-weight="700" fill="#34D399">✓</text>
    <text x="84" y="126" font-size="20" fill="#94A6BE">kept</text>
    <text x="164" y="126" font-size="26" font-weight="700" fill="#94A6BE">—</text>
    <text x="202" y="126" font-size="20" fill="#94A6BE">removed</text>
    <circle cx="321" cy="119.5" r="4" fill="#7A8CA6"/>
    <text x="333" y="126" font-size="20" fill="#94A6BE">read only</text>
    <text x="465" y="126" font-size="22" font-weight="700" fill="#C7D3E3">±</text>
    <text x="489" y="126" font-size="20" fill="#94A6BE">follows the current state</text>
  </g>

  <g id="grid" fill="none" stroke-width="1.5">
    <path d="M200 156V394M380 156V394M560 156V394M740 156V394M920 156V394M1100 156V394" stroke="#2A3B58"/>
    <path d="M56 156H1144M56 394H1144M56 234H1144M56 274H1144M56 314H1144M56 354H1144" stroke="#2A3B58"/>
    <path d="M56 194H1144" stroke="#33486B"/>
  </g>

  <g id="column-labels" font-size="20" fill="#C7D3E3" text-anchor="middle">
    <text x="290" y="182">Start at login</text>
    <text x="470" y="182">Monitor</text>
    <text x="650" y="182">Variables</text>
    <text x="830" y="182">Log</text>
    <text x="1010" y="182">Locator / path</text>
  </g>

  <g id="row-labels" font-size="21" fill="#E9EFF8">
    <text x="56" y="222">1 Install / Fix</text>
    <text x="56" y="262">2 Show status</text>
    <text x="56" y="302">3 Stop monitor</text>
    <text x="56" y="342">4 Full restore</text>
    <text x="56" y="382">5 Check for updates</text>
  </g>

  <g id="kept" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">
    <text x="290" y="214" dominant-baseline="central">✓</text>
    <text x="470" y="214" dominant-baseline="central">✓</text>
    <text x="830" y="214" dominant-baseline="central">✓</text>
    <text x="1010" y="214" dominant-baseline="central">✓</text>
    <text x="290" y="294" dominant-baseline="central">✓</text>
    <text x="830" y="294" dominant-baseline="central">✓</text>
    <text x="1010" y="294" dominant-baseline="central">✓</text>
    <text x="830" y="334" dominant-baseline="central">✓</text>
  </g>

  <g id="by-state" font-size="26" font-weight="700" fill="#C7D3E3" text-anchor="middle">
    <text x="650" y="214" dominant-baseline="central">±</text>
  </g>

  <g id="cleared" font-size="26" font-weight="700" fill="#94A6BE" text-anchor="middle">
    <text x="470" y="300.5">—</text>
    <text x="650" y="300.5">—</text>
    <text x="290" y="340.5">—</text>
    <text x="470" y="340.5">—</text>
    <text x="650" y="340.5">—</text>
    <text x="1010" y="340.5">—</text>
  </g>

  <g id="read-only" fill="#7A8CA6">
    <circle cx="290" cy="254" r="4"/>
    <circle cx="470" cy="254" r="4"/>
    <circle cx="650" cy="254" r="4"/>
    <circle cx="830" cy="254" r="4"/>
    <circle cx="1010" cy="254" r="4"/>
    <circle cx="290" cy="374" r="4"/>
    <circle cx="470" cy="374" r="4"/>
    <circle cx="650" cy="374" r="4"/>
    <circle cx="830" cy="374" r="4"/>
    <circle cx="1010" cy="374" r="4"/>
  </g>
</svg>
