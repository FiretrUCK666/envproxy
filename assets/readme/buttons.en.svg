<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each of the five buttons touches</title>
  <desc id="buttonsDesc">A five by five grid. Rows are the five buttons, columns are start at login, the monitor process, the variables, the log, and the locator plus path record. A check means kept, a dash means removed, a dot means read only. Read a column: only the variables column is written on install and cleared on stop; only the start at login column stays on stop and is removed on uninstall. Row 5 is dots all the way across: it only reads while it checks, and acts only after you agree to update, which is a full install, so that row follows install.</desc>

  <rect width="1200" height="500" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="74" font-size="32" font-weight="700" fill="#E9EFF8">What each button touches</text>
    <text x="56" y="98" dominant-baseline="central" font-size="26" font-weight="700" fill="#34D399">✓</text>
    <text x="84" y="106" font-size="20" fill="#94A6BE">kept</text>
    <text x="176" y="106" font-size="26" font-weight="700" fill="#94A6BE">—</text>
    <text x="216" y="106" font-size="20" fill="#94A6BE">removed</text>
    <circle cx="362" cy="99.5" r="4" fill="#7A8CA6"/>
    <text x="378" y="106" font-size="20" fill="#94A6BE">read only</text>
  </g>

  <g id="grid" fill="none" stroke-width="1.5">
    <path d="M200 136V374M380 136V374M560 136V374M740 136V374M920 136V374M1100 136V374M56 214H1144M56 254H1144M56 294H1144M56 334H1144" stroke="#2A3B58"/>
    <path d="M56 174H1144" stroke="#33486B"/>
  </g>

  <g id="column-labels" font-size="20" fill="#C7D3E3" text-anchor="middle">
    <text x="290" y="162">Start at login</text>
    <text x="470" y="162">Monitor</text>
    <text x="650" y="162">Variables</text>
    <text x="830" y="162">Log</text>
    <text x="1010" y="162">Locator / path</text>
  </g>

  <g id="row-labels" font-size="21" fill="#E9EFF8">
    <text x="56" y="202">1-安装 / install</text>
    <text x="56" y="242">2-停止监控 / stop</text>
    <text x="56" y="282">3-一键恢复 / uninstall</text>
    <text x="56" y="322">4-查看状态 / status</text>
    <text x="56" y="362">5-检查更新 / update</text>
  </g>

  <g id="kept" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">
    <text x="290" y="194" dominant-baseline="central">✓</text>
    <text x="470" y="194" dominant-baseline="central">✓</text>
    <text x="650" y="194" dominant-baseline="central">✓</text>
    <text x="830" y="194" dominant-baseline="central">✓</text>
    <text x="1010" y="194" dominant-baseline="central">✓</text>
    <text x="290" y="234" dominant-baseline="central">✓</text>
    <text x="830" y="234" dominant-baseline="central">✓</text>
    <text x="1010" y="234" dominant-baseline="central">✓</text>
    <text x="830" y="274" dominant-baseline="central">✓</text>
  </g>

  <g id="cleared" font-size="26" font-weight="700" fill="#94A6BE" text-anchor="middle">
    <text x="470" y="240.5">—</text>
    <text x="650" y="240.5">—</text>
    <text x="290" y="280.5">—</text>
    <text x="470" y="280.5">—</text>
    <text x="650" y="280.5">—</text>
    <text x="1010" y="280.5">—</text>
  </g>

  <g id="read-only" font-size="40" font-weight="700" fill="#7A8CA6" text-anchor="middle">
    <circle cx="290" cy="314" r="4"/>
    <circle cx="470" cy="314" r="4"/>
    <circle cx="650" cy="314" r="4"/>
    <circle cx="830" cy="314" r="4"/>
    <circle cx="1010" cy="314" r="4"/>
    <circle cx="290" cy="354" r="4"/>
    <circle cx="470" cy="354" r="4"/>
    <circle cx="650" cy="354" r="4"/>
    <circle cx="830" cy="354" r="4"/>
    <circle cx="1010" cy="354" r="4"/>
  </g>

  <text x="56" y="406" font-size="20" fill="#C7D3E3">Read a column: Variables is written on install, cleared on stop; Start at login stays on stop, goes on uninstall.</text>
  <text x="56" y="440" font-size="20" fill="#C7D3E3">Row 5 stays read only until you agree to update; that update is a full install.</text>
</svg>
