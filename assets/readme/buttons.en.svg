<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">An eight-row, five-column comparison table. The rows are the eight menu items: install or repair, show status, check for updates, help, advanced, stop the monitor, full restore, and exit. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a solid dot means read-only, a plus-minus means it depends on whether you are currently behind the proxy, a circular arrow means it is rebuilt or restarted when a new version is installed. Install corrects the environment variables; show status, help, and exit change nothing; advanced only creates the launcher folder and touches none of the five; stop clears the monitor and the variables while keeping start at login and the locator; full restore clears everything except the log.</desc>

  <rect width="1200" height="806" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="804.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

