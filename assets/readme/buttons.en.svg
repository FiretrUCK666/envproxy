<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="915" viewBox="0 0 1200 915" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu option touches</title>
  <desc id="buttonsDesc">A nine-row, five-column comparison table. Rows are the nine menu items; columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means it writes or keeps that item. A dash means it clears it. A solid dot means the menu item does not touch it at all. A blue arrow means it starts the item or restarts it (starts it when not running, restarts it when running so the newest code is loaded). A dash with a yellow ring means it stops and asks you first. Install writes the login entry, starts or restarts the monitor, corrects the environment variables for the current state, and rewrites the locator and path record, leaving the log alone. Show status, help, advanced, problem report and exit touch none of the five. Check for updates runs the install finish step after the new version lands, so the login entry, monitor, variables and locator are all handled again. Stop the monitor only stops the process and clears the variables; the login entry and locator stay, so it comes back at the next login. Full restore clears everything else and asks first whether to keep the log.</desc>

