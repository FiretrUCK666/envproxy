<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">A six-row, five-column comparison table. The rows are the six menu items: install or repair, show status, check for updates, help, stop the monitor, and full restore. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a solid dot means read-only, a plus-minus means it depends on whether you are currently behind the proxy, a circular arrow means it is rebuilt or restarted when a new version is installed. Install corrects the environment variables; stop clears the monitor and the variables while leaving start at login and the locator; full restore clears everything except the log; show status and help change nothing at all; check for updates only when a newer version exists replaces the program files and restarts the monitor on the new version (circular arrow).</desc>

