    <text x="419.5" y="162" font-size="22" fill="#94A6BE" textLength="137.5" lengthAdjust="spacing">leave alone</text>
    <g data-cx="598" data-cy="155"><path d="M598 147 V159 M593 152 L598 147 L603 152 M589 163 H607" fill="none" stroke="#60A5FA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="625" y="162" font-size="22" fill="#94A6BE" textLength="162.5" lengthAdjust="spacing">start/restart</text>
