<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">A six-row, five-column comparison table. The rows are the six menu items: install or repair, show status, check for updates, help, stop the monitor, and full restore. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a solid dot means read-only, a plus-minus means it depends on whether you are currently behind the proxy, a circular arrow means the monitor restarts when a new version is installed, and a hollow circle means nothing happens when the version is already current. Install corrects the environment variables; stop clears the monitor and the variables while leaving start at login and the locator; full restore clears everything except the log; show status and help change nothing at all; check for updates only when a newer version exists replaces the program files and restarts the monitor on the new version (circular arrow), and does nothing at all when already up to date (hollow circle).</desc>

  <rect width="1200" height="490" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="488.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="80" font-size="32" font-weight="700" fill="#E9EFF8">What each menu item affects</text>
  </g>
  <g id="legend">
    <text x="85" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#34D399">✓</text>
    <text x="112" y="126" font-size="20" fill="#94A6BE">kept</text>
    <rect x="172" y="117.8" width="18" height="2.4" rx="1.2" fill="#94A6BE"/>
    <text x="208" y="126" font-size="20" fill="#94A6BE">cleared</text>
    <circle cx="310" cy="119" r="4.5" fill="#7A8CA6"/>
    <text x="337" y="126" font-size="20" fill="#94A6BE">read-only</text>
    <text x="461" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#C7D3E3">±</text>
    <text x="488" y="126" font-size="20" fill="#94A6BE">state-dependent</text>
    <text x="678" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#60A5FA">↻</text>
    <text x="705" y="126" font-size="20" fill="#94A6BE">restarts on install</text>
    <circle cx="939" cy="119" r="5.5" fill="none" stroke="#94A6BE" stroke-width="1.6"/>
    <text x="966" y="126" font-size="20" fill="#94A6BE">no-op if current</text>
  </g>

