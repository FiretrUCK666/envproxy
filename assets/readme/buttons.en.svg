<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">A nine-row, five-column comparison table. The rows are the nine menu items: install or repair, show status, check for updates, help, advanced, stop the monitor, full restore, problem report, and exit. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a solid dot means read-only, a plus-minus means it depends on whether you are behind the proxy right now. Install corrects the variables; show status, help, and exit change nothing; advanced only creates the launcher folder; stop clears the monitor and the variables; full restore clears everything except the log; problem report only reads.</desc>

  <rect width="1200" height="880" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="878.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="92" font-size="36" font-weight="700" fill="#E9EFF8">What each menu item affects</text>
  </g>

  <g id="legend">
    <path d="M62 152L68 158L80 144" fill="none" stroke="#34D399" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="162" font-size="22" fill="#94A6BE">kept</text>
    <path d="M183 155H203" fill="none" stroke="#94A6BE" stroke-width="3" stroke-linecap="round"/>
    <text x="222" y="162" font-size="22" fill="#94A6BE">cleared</text>
    <circle cx="315" cy="155" r="5.5" fill="#7A8CA6"/>
    <text x="344" y="162" font-size="22" fill="#94A6BE">read-only</text>
    <path d="M471 151H491M481 146V160M471 164H491" fill="none" stroke="#C7D3E3" stroke-width="2.8" stroke-linecap="round"/>
    <text x="510" y="162" font-size="22" fill="#94A6BE">depends on proxy state</text>
  </g>

  <g id="column-labels" font-size="23" fill="#C7D3E3" text-anchor="middle">
