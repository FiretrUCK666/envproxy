<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="915" viewBox="0 0 1200 915" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">What each menu item affects</title>
  <desc id="buttonsDesc">A nine-row, five-column comparison table. The rows are the nine menu items: install or repair, show status, check for updates, help, advanced, stop the monitor, full restore, problem report, and exit. The columns are start at login, monitor process, environment variables, log, and locator with path record. A check mark means kept, a dash means cleared, a solid dot means read-only, a plus-minus means it depends on whether you are behind the proxy right now, and a check mark above a dash means either kept or cleared, depending on what you choose. Install writes the login entry, corrects the variables for the current state, and rewrites the shell profile and path record, leaving the log alone. Show status, help, and exit change nothing. Check updates only swaps the program itself and refreshes the path record. Advanced only creates or removes proxy shortcuts. Stop kills the monitor process and clears the variables; the login entry and the locator stay, so it comes back at the next login. Full restore clears everything else, asking first whether to keep the log. Problem report only reads.</desc>

