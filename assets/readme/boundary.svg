<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="boundaryTitle boundaryDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="boundaryTitle">更新会动什么，不会动什么</title>
  <desc id="boundaryDesc">EnvProxy 文件夹分三块，规则不一样。最外层是你的地盘，更新只覆盖同名文件，绝不删你的东西；win、mac、release-notes、assets 是程序自己的地盘，更新会覆盖作用域内的内容，另一平台的目录碰都不碰，新包里没有的文件会被清掉，所以别把自己的文件放进去；win\monitor\ 与 mac\monitor\ 里是日志和运行标记，永不备份、永不覆盖、永不删。另外三样它从不碰：系统代理、系统级环境变量、管理员权限与系统目录。</desc>

  <rect width="1200" height="560" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.87" width="1198.5" height="558.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="86.05" font-size="32" font-weight="700" fill="#E9EFF8">更新会动什么，不会动什么</text>
    <text x="56" y="123.26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#94A6BE">同一个文件夹，三块区域的规则不一样</text>
  </g>

  <g id="folder">
    <rect x="56" y="153.49" width="1088" height="241.86" rx="16" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
    <text x="80" y="190.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#E9EFF8">EnvProxy\</text>
    <text x="1120" y="190.7" font-size="20" fill="#34D399" text-anchor="end">你的地盘</text>
    <text x="80" y="220.93" font-size="18" fill="#94A6BE">只覆盖同名文件，绝不删你的东西</text>

    <rect x="80" y="237.21" width="1040" height="144.19" rx="14" fill="#16243A" stroke="#2A3B58" stroke-width="1.5"/>
    <text x="108" y="269.77" font-size="20" fill="#38BDF8">程序地盘</text>
    <text x="212" y="269.77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#C7D3E3">win\  mac\  release-notes\  assets\</text>
    <text x="108" y="302.33" font-size="18" fill="#94A6BE">更新会覆盖，新包里没有的文件会被清掉</text>
    <text x="456" y="302.33" font-size="18" fill="#C7D3E3">别把自己的文件放这里</text>

    <rect x="108" y="318.61" width="984" height="51.16" rx="10" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
    <text x="128" y="344.19" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#C7D3E3">win\monitor\  mac\monitor\</text>
    <text x="433" y="344.19" dominant-baseline="central" font-size="18" fill="#C7D3E3">日志与运行标记永不覆盖、永不删</text>
    <text x="1072" y="344.19" dominant-baseline="central" font-size="20" fill="#34D399" text-anchor="end">运行时</text>
  </g>

  <g id="never">
    <text x="56" y="451.17" font-size="22" font-weight="700" fill="#E9EFF8">从不碰</text>
    <rect x="168" y="413.96" width="196" height="55.81" rx="10" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
    <text x="266" y="450" font-size="20" fill="#C7D3E3" text-anchor="middle">系统代理</text>
    <rect x="380" y="413.96" width="256" height="55.81" rx="10" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
    <text x="508" y="450" font-size="20" fill="#C7D3E3" text-anchor="middle">系统级环境变量</text>
    <rect x="652" y="413.96" width="300" height="55.81" rx="10" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
    <text x="802" y="450" font-size="20" fill="#C7D3E3" text-anchor="middle">管理员权限 / 系统目录</text>
  </g>

  <text x="56" y="509.31" font-size="20" fill="#C7D3E3">更新只动程序自己的地盘，日志与你的文件都不动。</text>
</svg>
