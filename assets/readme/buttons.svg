    <text x="56" y="92" font-size="36" font-weight="700" fill="#E9EFF8">菜单每个选项影响什么</text>
  </g>

  <g id="legend">
    <g data-cx="69"><path d="M62 156 L66.2 160 L76 150" fill="none" stroke="#34D399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="96" y="162" font-size="22" fill="#94A6BE" textLength="44" lengthAdjust="spacing">保留</text>
    <g data-cx="181"><path d="M174 155H188" fill="none" stroke="#94A6BE" stroke-width="3" stroke-linecap="round"/></g>
    <text x="208" y="162" font-size="22" fill="#94A6BE" textLength="44" lengthAdjust="spacing">清掉</text>
    <g data-cx="293"><circle cx="293" cy="155" r="7" fill="#7A8CA6"/></g>
    <text x="320" y="162" font-size="22" fill="#94A6BE" textLength="88" lengthAdjust="spacing">只读不动</text>
    <g data-cx="449"><path d="M442 152 H456 M449 148 V162 M442 158 H456" fill="none" stroke="#C7D3E3" stroke-width="2.6" stroke-linecap="round"/></g>
    <text x="476" y="162" font-size="22" fill="#94A6BE" textLength="198" lengthAdjust="spacing">看当前有没有在翻墙</text>
    <g data-cx="715"><path d="M709 150 L713 154 L721 145" fill="none" stroke="#34D399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M709 162 H721" fill="none" stroke="#94A6BE" stroke-width="2.6" stroke-linecap="round"/></g>
    <text x="736" y="162" font-size="22" fill="#94A6BE" textLength="110" lengthAdjust="spacing">保留或清掉</text>
  </g>

  <g id="column-labels" font-size="23" fill="#C7D3E3" text-anchor="middle">
    <text x="379" y="250">开机自启</text>
    <text x="554" y="250">监控进程</text>
