<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">菜单每个选项影响什么</title>
  <desc id="buttonsDesc">八行五列的对照表。行是菜单里的八个选项：安装修复、查看状态、检查更新、帮助、高级功能、停止监控、一键恢复、退出。列是开机自启、监控进程、环境变量、日志、定位器与路径记录。对勾表示保留，横线表示清掉，圆点表示只读不动，正负号表示按当前有没有在翻墙来定，回转箭头表示装新版时会重建或重启。安装会校正环境变量；查看状态、帮助、退出什么都不改；高级功能只新建启动脚本目录，不动这五样；停止清掉监控与环境变量、留下自启与定位器；一键恢复全部清除、只留日志。</desc>

  <rect width="1200" height="806" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="804.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="92" font-size="36" font-weight="700" fill="#E9EFF8">菜单每个选项影响什么</text>
  </g>

  <g id="legend">
    <path d="M62 155L68 161L80 148" fill="none" stroke="#34D399" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="162" font-size="22" fill="#94A6BE">保留</text>
    <path d="M183 155H203" fill="none" stroke="#94A6BE" stroke-width="3" stroke-linecap="round"/>
    <text x="222" y="162" font-size="22" fill="#94A6BE">清掉</text>
    <circle cx="315" cy="155" r="5.5" fill="#7A8CA6"/>
    <text x="344" y="162" font-size="22" fill="#94A6BE">只读不动</text>
    <path d="M471 151H491M481 146V160M471 164H491" fill="none" stroke="#C7D3E3" stroke-width="2.8" stroke-linecap="round"/>
    <text x="510" y="162" font-size="22" fill="#94A6BE">看当前有没有在翻墙</text>
    <path d="M757 147A8.5 8.5 0 1 1 757 163M753.5 163L757 163L759.5 158.5" fill="none" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="786" y="162" font-size="22" fill="#94A6BE">装新版时重建</text>
  </g>

  <g id="grid" fill="none" stroke-width="1.5">
    <path d="M276 216V730M483 216V730M624 216V730M824 216V730M905 216V730M1144 216V730" stroke="#2A3B58"/>
    <path d="M56 216H1144M56 730H1144" stroke="#2A3B58"/>
    <path d="M56 266H1144" stroke="#33486B"/>
  </g>

  <g id="column-labels" font-size="23" fill="#C7D3E3" text-anchor="middle">
    <text x="379" y="250">开机自启</text>
    <text x="553" y="250">监控进程</text>
    <text x="724" y="250">环境变量</text>
    <text x="864" y="250">日志</text>
    <text x="1024" y="250">定位器与路径记录</text>
  </g>

  <g id="row-labels" font-size="23" fill="#E9EFF8">
    <text x="56" y="303">1 安装 / 修复</text>
    <text x="56" y="361">2 查看状态</text>
    <text x="56" y="419">3 检查更新</text>
    <text x="56" y="477">4 帮助</text>
    <text x="56" y="535">7 高级功能</text>
    <text x="56" y="593">5 停止监控</text>
    <text x="56" y="651">6 一键恢复</text>
    <text x="56" y="709">0 退出</text>
  </g>

  <g id="row-lines" stroke="#2A3B58" stroke-width="1.5">
    <path d="M56 324H1144M56 382H1144M56 440H1144M56 498H1144M56 556H1144M56 614H1144M56 672H1144"/>
  </g>

