<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">菜单每个选项影响什么</title>
  <desc id="buttonsDesc">六行五列的对照表。行是菜单里的六个选项：安装修复、查看状态、检查更新、帮助、停止监控、一键恢复。列是开机自启、监控进程、环境变量、日志、定位器与路径记录。对勾表示保留，横线表示清掉，实心圆点表示只读不动，正负号表示按当前有没有在翻墙来定，回转箭头表示装新版时才重启，空心圆表示没新版时什么都不做。安装会校正环境变量；停止清掉监控与环境变量、留下自启与定位器；一键恢复全部清除、只留日志；查看状态、帮助两项什么都不改；检查更新有新版时才替换程序文件并把监控停掉、用新版本重启（回转箭头）；已经是最新时什么都不做（空心圆）。</desc>

  <rect width="1200" height="490" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="488.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="80" font-size="32" font-weight="700" fill="#E9EFF8">菜单每个选项影响什么</text>
  </g>
  <g id="legend">
    <text x="85" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#34D399">✓</text>
    <text x="112" y="126" font-size="20" fill="#94A6BE">保留</text>
    <rect x="194" y="117.8" width="18" height="2.4" rx="1.2" fill="#94A6BE"/>
    <text x="230" y="126" font-size="20" fill="#94A6BE">清掉</text>
    <circle cx="321" cy="119" r="4.5" fill="#7A8CA6"/>
    <text x="348" y="126" font-size="20" fill="#94A6BE">只读不动</text>
    <text x="479" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#C7D3E3">±</text>
    <text x="506" y="126" font-size="20" fill="#94A6BE">看当前有没有在翻墙</text>
    <text x="737" y="119" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#60A5FA">↻</text>
    <text x="764" y="126" font-size="20" fill="#94A6BE">装新版时才重启</text>
    <circle cx="955" cy="119" r="5.5" fill="none" stroke="#94A6BE" stroke-width="1.6"/>
    <text x="982" y="126" font-size="20" fill="#94A6BE">没新版什么都不做</text>
  </g>

<g id="grid" fill="none" stroke-width="1.5">
    <path d="M200 156V434M380 156V434M560 156V434M740 156V434M920 156V434M1100 156V434" stroke="#2A3B58"/>
    <path d="M56 156H1144M56 434H1144" stroke="#2A3B58"/>
    <path d="M56 194H1144M56 354H1144" stroke="#33486B"/>
  </g>

  <g id="column-labels" font-size="20" fill="#C7D3E3" text-anchor="middle">
    <text x="290" y="182">开机自启</text>
    <text x="470" y="182">监控进程</text>
    <text x="650" y="182">环境变量</text>
    <text x="830" y="182">日志</text>
    <text x="1010" y="182">定位器与路径记录</text>
  </g>

  <g id="row-labels" font-size="21" fill="#E9EFF8">
    <text x="56" y="222">1 安装 / 修复</text>
    <text x="56" y="262">2 查看状态</text>
    <text x="56" y="302">3 检查更新</text>
    <text x="56" y="342">4 帮助</text>
    <text x="56" y="382">5 停止监控</text>
    <text x="56" y="422">6 一键恢复</text>
  </g>

  <g id="row-lines" stroke="#2A3B58" stroke-width="1.5">
    <path d="M56 234H1144M56 274H1144M56 314H1144M56 394H1144"/>
  </g>

