<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="915" viewBox="0 0 1200 915" role="img" aria-labelledby="buttonsTitle buttonsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="buttonsTitle">菜单每个选项影响什么</title>
  <desc id="buttonsDesc">九行五列的对照表。行是菜单里的九个选项：安装修复、查看状态、检查更新、帮助、高级功能、停止监控、一键恢复、问题反馈、退出。列是开机自启、监控进程、环境变量、日志、定位器与路径记录。对勾表示保留，横线表示清掉，圆点表示只读不动，十字表示看当前有没有在翻墙来定，对勾与横线叠在一起表示保留或清掉都有可能、看你怎么选。安装会写入自启、按当前状态校正环境变量、重写终端配置与路径记录，日志一直不动；查看状态、帮助、退出什么都不改；检查更新只换程序本体、顺带刷新路径记录；高级功能只建或删走代理的快捷方式；停止只停监控进程、清环境变量，自启和定位器都留着，下次开机会自己回来；一键恢复其余全部清除，只有历史日志会先问你要不要留；问题反馈只读不写。</desc>

  <rect width="1200" height="915" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="913.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

