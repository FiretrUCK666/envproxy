    <text x="112" y="126" font-size="20" fill="#94A6BE">保留</text>
    <g class="icon" data-cx="192" data-cy="119"><path d="M183.0 119.0H201.0" fill="none" stroke="#94A6BE" stroke-width="2.6" stroke-linecap="round"/></g>
    <text x="219" y="126" font-size="20" fill="#94A6BE">清掉</text>
    <g class="icon" data-cx="299" data-cy="119"><circle cx="299" cy="119" r="4.5" fill="#7A8CA6"/></g>
    <text x="326" y="126" font-size="20" fill="#94A6BE">只读不动</text>
    <g class="icon" data-cx="446" data-cy="119"><path d="M437.5 114.8L454.5 114.8L454.5 117.2L437.5 117.2ZM444.8 110.5L447.2 110.5L447.2 121.5L444.8 121.5ZM437.5 125.3L454.5 125.3L454.5 127.7L437.5 127.7Z" fill="#C7D3E3" stroke="none"/></g>
    <text x="473" y="126" font-size="20" fill="#94A6BE">看当前有没有在翻墙</text>
    <g class="icon" data-cx="693" data-cy="119"><path d="M700.0 121.5L698.7 123.8L696.7 125.4L694.3 126.3L691.7 126.3L689.3 125.4L687.3 123.8L686.0 121.5L685.6 119.0L686.0 116.5L687.3 114.2L689.3 112.6L691.7 111.7L694.3 111.7L696.7 112.6L698.7 114.2L700.0 116.5M697.2 117.0L700.9 119.2M702.4 115.2L700.9 119.2" fill="none" stroke="#60A5FA" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="720" y="126" font-size="20" fill="#94A6BE">装新版时重建</text>
  </g>

<g id="grid" fill="none" stroke-width="1.5">
