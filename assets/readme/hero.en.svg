<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="387" viewBox="0 0 1200 387" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">EnvProxy — automatic proxy for terminals (environment variables)</title>
  <desc id="heroDesc">On the left: the project name and its one-line value — VPN app on, the terminal proxies; VPN app off, the terminal is back to direct. On the right: an excerpt of the real status output (Show status in the menu), showing the monitor running, auto-start enabled, the VPN app detected, and proxy variables injected.</desc>

  <rect width="1200" height="387" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="385.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="56" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#94A6BE">WINDOWS 10/11 · macOS 12+ · NO DEPENDENCIES</text>

    <text x="56" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="62" font-weight="700" fill="#E9EFF8"><tspan fill="#38BDF8">&gt; </tspan>EnvProxy</text>

    <text x="56" y="222" font-size="27" fill="#E9EFF8">VPN app on, terminal proxies.</text>
    <text x="56" y="258" font-size="27" fill="#E9EFF8">VPN app off, back to direct.</text>

    <g id="chips" font-size="18" fill="#C7D3E3">
      <rect x="56" y="288" width="126" height="38" rx="9" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="119" y="313" text-anchor="middle">NO INSTALL</text>
      <rect x="196" y="288" width="108" height="38" rx="9" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="250" y="313" text-anchor="middle">NO ADMIN</text>
      <rect x="318" y="288" width="144" height="38" rx="9" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="390" y="313" text-anchor="middle">ZERO RESIDUE</text>
    </g>
  </g>

  <g id="project-proof">
    <rect x="600" y="80" width="544" height="256" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>

    <g id="card-header" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <circle cx="628" cy="114.5" r="5" fill="#33486B"/>
      <circle cx="646" cy="114.5" r="5" fill="#33486B"/>
      <circle cx="664" cy="114.5" r="5" fill="#33486B"/>
      <text x="677" y="120.5" font-size="19" fill="#C7D3E3">Status</text>
      <text x="1120" y="120.5" font-size="18" fill="#94A6BE" text-anchor="end">output excerpt, labels translated</text>
    </g>

    <line x1="600" y1="143.5" x2="1144" y2="143.5" stroke="#2A3B58" stroke-width="1.5"/>

    <g id="card-body" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#94A6BE">
      <text x="628" y="187.5">Monitor   : <tspan fill="#C7D3E3">running (PID 8268)</tspan></text>
      <text x="628" y="227.5">Auto-run  : <tspan fill="#C7D3E3">enabled</tspan></text>
      <text x="628" y="267.5">Proxying  : <tspan fill="#34D399">active (port 7078)</tspan></text>
      <text x="628" y="307.5">Variables : <tspan fill="#34D399">injected (http://127.0.0.1:7078)</tspan></text>
    </g>
  </g>
</svg>
