<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="498.8" viewBox="0 0 1200 499" role="img" aria-labelledby="qsTitle qsDesc">
  <title id="qsTitle">Three things: what to do after installing</title>
  <desc id="qsDesc">Three side-by-side cards explaining what you will run into after installing. Card one: a window opened after installing reads the current state when it starts, so nothing is needed. Card two: a window opened after installing where the proxy changed later, press Enter once or run any command and it reads again. Card three: a window opened before installing never had the sync script loaded into it, so reopen it or load the script by hand.</desc>

  <rect width="1200" height="498.8" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.87" width="1198.5" height="497.06" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="83.52" font-size="32" font-weight="700" fill="#E9EFF8">Only three things to do after installing</text>
  </g>

  <g id="cards" fill="none" stroke="#2A3B58" stroke-width="1.5">
    <rect x="56" y="125.28" width="336" height="313.2" rx="14" fill="#16243A"/>
    <rect x="432" y="125.28" width="336" height="313.2" rx="14" fill="#16243A"/>
    <rect x="808" y="125.28" width="336" height="313.2" rx="14" fill="#16243A"/>
  </g>

  <g id="card1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <circle cx="96" cy="180.96" r="18" fill="#34D399" opacity="0.16"/>
    <text x="96" y="189.08" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">1</text>
    <text x="132" y="189.08" font-size="20" font-weight="700" fill="#E9EFF8">Opened after install</text>
    <text x="88" y="245.92" font-size="19" fill="#C7D3E3">Nothing to do.</text>
    <text x="88" y="280.72" font-size="19" fill="#C7D3E3">It reads the current</text>
    <text x="88" y="315.52" font-size="19" fill="#C7D3E3">state when it starts.</text>
    <text x="88" y="378.16" font-size="17" fill="#94A6BE">Proxy on or off makes no difference.</text>
    <text x="88" y="408.32" font-size="17" fill="#38BDF8">Terminals started by AI tools count too.</text>
  </g>

  <g id="card2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <circle cx="472" cy="180.96" r="18" fill="#38BDF8" opacity="0.16"/>
    <text x="472" y="189.08" font-size="20" font-weight="700" fill="#38BDF8" text-anchor="middle">2</text>
    <text x="508" y="189.08" font-size="20" font-weight="700" fill="#E9EFF8">Changed after opening</text>
    <text x="464" y="245.92" font-size="19" fill="#C7D3E3">Press Enter once.</text>
    <text x="464" y="280.72" font-size="19" fill="#C7D3E3">Any command works too;</text>
    <text x="464" y="315.52" font-size="19" fill="#C7D3E3">it reads again afterwards.</text>
    <text x="464" y="378.16" font-size="17" fill="#94A6BE">To skip the Enter, open a new window</text>
    <text x="464" y="408.32" font-size="17" fill="#38BDF8">and it reads the current state.</text>
  </g>

  <g id="card3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <circle cx="848" cy="180.96" r="18" fill="#94A6BE" opacity="0.16"/>
    <text x="848" y="189.08" font-size="20" font-weight="700" fill="#94A6BE" text-anchor="middle">3</text>
    <text x="884" y="189.08" font-size="20" font-weight="700" fill="#E9EFF8">Opened before install</text>
    <text x="840" y="245.92" font-size="19" fill="#C7D3E3">Reopen it once.</text>
    <text x="840" y="280.72" font-size="19" fill="#C7D3E3">The sync script was</text>
    <text x="840" y="315.52" font-size="19" fill="#C7D3E3">never loaded into it.</text>
    <text x="840" y="378.16" font-size="17" fill="#94A6BE">To skip: load the script</text>
    <text x="840" y="408.32" font-size="17" fill="#38BDF8">once; it is in section 3.1.</text>
  </g>
</svg>
