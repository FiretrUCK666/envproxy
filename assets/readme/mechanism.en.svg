<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="mechTitle mechDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="mechTitle">EnvProxy three-layer check</title>
  <desc id="mechDesc">Flow: polled every 2-3 seconds, three gates in order — a local port is listening, the port answers a CONNECT handshake, and one real fetch through it reaches the outside world. Passing all three writes the whole proxy variable set; failing deletes it and returns the terminal to a direct connection.</desc>

  <rect width="1200" height="650" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.84" width="1198.5" height="648.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="85.12" font-size="32" font-weight="700" fill="#E9EFF8">Three layers of evidence — all three required</text>
    <text x="56" y="123.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#94A6BE">polled every 2–3 s · traffic truth, not brand names</text>
  </g>

  <g id="gates">
    <g id="gate-1">
      <rect x="56" y="156.8" width="340" height="241.92" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
      <text x="80" y="201.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8" letter-spacing="1">LAYER 1</text>
      <text x="80" y="248.64" font-size="26" font-weight="700" fill="#E9EFF8">A port is listening</text>
      <text x="80" y="286.72" font-size="19" fill="#94A6BE">Is any local port open for</text>
      <text x="80" y="315.84" font-size="19" fill="#94A6BE">business right now?</text>
      <rect x="80" y="333.76" width="155" height="38.08" rx="8" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="98" y="359.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8">7078 LISTEN</text>
    </g>

    <g id="gate-2">
      <rect x="424" y="156.8" width="340" height="241.92" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
      <text x="448" y="201.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8" letter-spacing="1">LAYER 2</text>
      <text x="448" y="248.64" font-size="26" font-weight="700" fill="#E9EFF8">CONNECT handshake</text>
      <text x="448" y="286.72" font-size="19" fill="#94A6BE">Does that port answer a</text>
      <text x="448" y="315.84" font-size="19" fill="#94A6BE">proxy handshake? (no egress)</text>
      <rect x="448" y="333.76" width="166" height="38.08" rx="8" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="466" y="359.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8">HTTP/1.x 200</text>
    </g>

    <g id="gate-3">
      <rect x="792" y="156.8" width="340" height="241.92" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
      <text x="816" y="201.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8" letter-spacing="1">LAYER 3</text>
      <text x="816" y="248.64" font-size="26" font-weight="700" fill="#E9EFF8">Real node reachable</text>
      <text x="816" y="286.72" font-size="19" fill="#94A6BE">Fetch once through it —</text>
      <text x="816" y="315.84" font-size="19" fill="#94A6BE">headers only, no body</text>
      <rect x="816" y="333.76" width="284" height="38.08" rx="8" fill="#16243A" stroke="#33486B" stroke-width="1.5"/>
      <text x="834" y="359.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#38BDF8">6 endpoints · fast lane</text>
    </g>
  </g>

  <g id="flowarrows" fill="none" stroke="#7A8CA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M402 268.8L418 277.76L402 286.72"/>
    <path d="M770 268.8L786 277.76L770 286.72"/>
  </g>

  <g id="branch" fill="none" stroke="#33486B" stroke-width="2" stroke-linecap="round">
    <path d="M962 398.72L962 418.88"/>
    <path d="M316 418.88L962 418.88"/>
    <path d="M316 418.88L316 439.04"/>
    <path d="M884 418.88L884 439.04"/>
  </g>
  <text x="976" y="425.6" font-size="18" fill="#94A6BE">Reachable?</text>

  <g id="outcome">
    <g id="outcomeon">
      <rect x="56" y="439.04" width="520" height="125.44" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
      <text x="80" y="473.2" dominant-baseline="central" font-size="24" font-weight="700" fill="#34D399">UP → write the whole variable set</text>
      <text x="80" y="506.8" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#C7D3E3">HTTP_PROXY  HTTPS_PROXY  ALL_PROXY</text>
      <text x="80" y="535.92" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#C7D3E3">NO_PROXY  NODE_USE_ENV_PROXY</text>
    </g>

    <g id="outcomeoff">
      <rect x="624" y="439.04" width="520" height="125.44" rx="14" fill="#0B1220" stroke="#2A3B58" stroke-width="1.5"/>
      <text x="648" y="472.64" dominant-baseline="central" font-size="24" font-weight="700" fill="#94A6BE">10 s of failures → delete the set</text>
      <text x="648" y="506.24" dominant-baseline="central" font-size="18" fill="#94A6BE">"Disconnected" with the kernel alive</text>
      <text x="648" y="535.36" dominant-baseline="central" font-size="18" fill="#94A6BE">3 failures minimum; one bad probe never counts</text>
    </g>
  </g>

  <text x="56" y="598.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#94A6BE">Same verdict writes or deletes — new ports or new apps need no clicks.</text>
</svg>
