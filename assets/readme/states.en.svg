<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="statesTitle statesDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="statesTitle">Day to day: nothing to do</title>
  <desc id="statesDesc">Three side-by-side states. Connecting the proxy app writes the full variable set in 6 to 10 seconds; disconnecting or quitting removes the variables and restores direct connection in about 8 seconds after quitting or 15 to 50 seconds after disconnecting only, and reconnecting takes about 10 to 25 seconds; new ports, new apps and flapping are followed automatically with no change to the variables. Reboots, moves and running two apps need no attention either.</desc>

  <rect width="1200" height="380" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="70" font-size="32" font-weight="700" fill="#E9EFF8">Day to day: nothing to do</text>
  </g>

  <g id="boxes" fill="none" stroke="#2A3B58" stroke-width="1.5">
    <rect x="56" y="100" width="320" height="190" rx="12"/>
    <rect x="440" y="100" width="320" height="190" rx="12"/>
    <rect x="824" y="100" width="320" height="190" rx="12"/>
  </g>

  <g id="arrows" stroke="#33486B" stroke-width="2" fill="none">
    <path d="M384 195H432"/>
    <path d="M420 187L432 195L420 203"/>
    <path d="M768 195H816"/>
    <path d="M804 187L816 195L804 203"/>
  </g>

  <g id="labels">
    <text x="216" y="152" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Proxy app connects</text>
    <text x="216" y="192" font-size="20" fill="#C7D3E3" text-anchor="middle">Write the full variable set</text>
    <text x="216" y="232" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">6–10 seconds</text>
    <text x="216" y="260" font-size="18" fill="#94A6BE" text-anchor="middle">from launch to variables written</text>
    <text x="600" y="152" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Disconnect or quit</text>
    <text x="600" y="192" font-size="20" fill="#C7D3E3" text-anchor="middle">Remove them, back to direct</text>
    <text x="600" y="232" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">quit in about 8 s</text>
    <text x="600" y="260" font-size="18" fill="#94A6BE" text-anchor="middle">disconnect only: 15–50 s</text>
    <text x="984" y="152" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">New port · flapping</text>
    <text x="984" y="192" font-size="20" fill="#C7D3E3" text-anchor="middle">New ports are followed</text>
    <text x="984" y="232" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">Variables stay put</text>
    <text x="984" y="260" font-size="18" fill="#94A6BE" text-anchor="middle">new apps, too</text>
  </g>

  <g id="footer">
    <text x="56" y="336" font-size="20" fill="#C7D3E3">Reboots, moves and two apps at once: leave them alone, it finds its way back.</text>
  </g>
</svg>
