<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448.4" viewBox="0 0 1200 448" role="img" aria-labelledby="statesTitle statesDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="statesTitle">Day to day: nothing to do</title>
  <desc id="statesDesc">Three side-by-side states. Connecting the proxy app writes the full variable set in 6 to 10 seconds; disconnecting or quitting removes the variables and restores direct connection in about 8 seconds after quitting or 15 to 50 seconds after disconnecting only, and reconnecting takes about 10 to 25 seconds; new ports, new apps and flapping are followed automatically, and the port inside the variables is rewritten to match. Reboots, moves and running two apps need no attention either.</desc>

  <rect width="1200" height="448.4" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.89" width="1198.5" height="446.63" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="82.6" font-size="32" font-weight="700" fill="#E9EFF8">Day to day: nothing to do</text>
  </g>

  <g id="boxes" fill="none" stroke="#2A3B58" stroke-width="1.5">
    <rect x="56" y="118" width="320" height="224.2" rx="12"/>
    <rect x="440" y="118" width="320" height="224.2" rx="12"/>
    <rect x="824" y="118" width="320" height="224.2" rx="12"/>
  </g>

  <g id="arrows" stroke="#33486B" stroke-width="2" fill="none">
    <path d="M384 230.1H432"/>
    <path d="M420 220.66L432 230.1L420 239.54"/>
    <path d="M768 230.1H816"/>
    <path d="M804 220.66L816 230.1L804 239.54"/>
  </g>

  <g id="labels">
    <text x="216" y="179.36" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Proxy app connects</text>
    <text x="216" y="226.56" font-size="20" fill="#C7D3E3" text-anchor="middle">Writes all proxy vars</text>
    <text x="216" y="273.76" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">6–10 seconds</text>
    <text x="216" y="306.8" font-size="18" fill="#94A6BE" text-anchor="middle">from launch to vars set</text>
    <text x="600" y="179.36" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">Disconnect or quit</text>
    <text x="600" y="226.56" font-size="20" fill="#C7D3E3" text-anchor="middle">Removed, back to direct</text>
    <text x="600" y="273.76" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">quit in about 8 s</text>
    <text x="600" y="306.8" font-size="18" fill="#94A6BE" text-anchor="middle">disconnect only: 15–50 s</text>
    <text x="984" y="179.36" font-size="24" font-weight="700" fill="#E9EFF8" text-anchor="middle">New port · flapping</text>
    <text x="984" y="226.56" font-size="20" fill="#C7D3E3" text-anchor="middle">New ports are followed</text>
    <text x="984" y="273.76" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">Rewritten to new port</text>
    <text x="984" y="306.8" font-size="18" fill="#94A6BE" text-anchor="middle">new apps, too</text>
  </g>

  <g id="footer">
    <text x="56" y="396.48" font-size="20" fill="#C7D3E3">Reboots, moves and two apps at once: leave them alone, it finds its way back.</text>
  </g>
</svg>
