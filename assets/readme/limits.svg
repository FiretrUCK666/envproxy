<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="limitsTitle limitsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="limitsTitle">五条技术边界</title>
  <desc id="limitsDesc">五条编号的技术边界，说明它不做的五件事。第一，纯 TUN 模式不处理，因为不监听本地端口，没有端口可以判断，而这种模式下所有流量本来就经过它。第二，不修改系统代理设置，因为那会影响浏览器和其他程序，只写用户级环境变量。第三，不改变已经运行的程序，因为环境变量只在进程启动时读一次，已经打开的窗口需要按一次回车。第四，不管需要自己配置代理的工具，因为它们不读这几个变量。第五，不提供界面，因为零依赖是安装前提。</desc>

  <rect width="1200" height="470" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="468.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="70" font-size="32" font-weight="700" fill="#E9EFF8">五条技术边界：它不做这些事</text>
  </g>

  <g id="rules" stroke="#2A3B58" stroke-width="1.5">
    <path d="M56 112H1144M56 182H1144M56 252H1144M56 322H1144M56 392H1144"/>
  </g>

  <g id="badges" fill="none" stroke="#34D399" stroke-width="2">
    <circle cx="86" cy="147" r="16"/>
    <circle cx="86" cy="217" r="16"/>
    <circle cx="86" cy="287" r="16"/>
    <circle cx="86" cy="357" r="16"/>
    <circle cx="86" cy="427" r="16"/>
  </g>

  <g id="numbers" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">
    <text x="86" y="147" dy="0.35em">1</text>
    <text x="86" y="217" dy="0.35em">2</text>
    <text x="86" y="287" dy="0.35em">3</text>
    <text x="86" y="357" dy="0.35em">4</text>
    <text x="86" y="427" dy="0.35em">5</text>
  </g>

  <g id="labels" font-size="21" fill="#E9EFF8">
    <text x="120" y="140">纯 TUN 模式不处理</text>
    <text x="120" y="166" font-size="16" fill="#94A6BE">它不监听本地端口，没有端口可以判断；这种模式下流量本来就全走它。</text>

    <text x="120" y="210">不修改系统代理设置</text>
    <text x="120" y="236" font-size="16" fill="#94A6BE">那会影响浏览器和其他程序。只写用户级环境变量。</text>

    <text x="120" y="280">不改变已经运行的程序</text>
    <text x="120" y="306" font-size="16" fill="#94A6BE">环境变量只在进程启动时读一次，已经打开的窗口要按一次回车。</text>

    <text x="120" y="350">不管需要自己配置代理的工具</text>
    <text x="120" y="376" font-size="16" fill="#94A6BE">它们不读这几个变量。Maven、Gradle、Docker 等要单独配置。</text>

    <text x="120" y="420">不提供界面</text>
    <text x="120" y="446" font-size="16" fill="#94A6BE">零依赖是安装前提。只有一个菜单，没有托盘图标。</text>
  </g>
</svg>
