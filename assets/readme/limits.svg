<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="limitsTitle limitsDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="limitsTitle">四条边界：先看一眼</title>
  <desc id="limitsDesc">四条编号的技术边界。纯 TUN 模式不注入，是正确行为；断开不等于退出，以流量真相为准；搬到搜索范围之外要手动安装接管一次；此前手设过的用户级代理变量会被先快照、卸载时按快照还原。</desc>

  <rect width="1200" height="400" rx="20" fill="#17263E"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="19.25" fill="none" stroke="#33486B" stroke-width="1.5"/>

  <g id="heading">
    <text x="56" y="70" font-size="32" font-weight="700" fill="#E9EFF8">四条边界：先看一眼</text>
  </g>

  <g id="rules" stroke="#2A3B58" stroke-width="1.5">
    <path d="M56 112H1144M56 182H1144M56 252H1144M56 322H1144"/>
  </g>

  <g id="badges" fill="none" stroke="#34D399" stroke-width="2">
    <circle cx="86" cy="147" r="16"/>
    <circle cx="86" cy="217" r="16"/>
    <circle cx="86" cy="287" r="16"/>
    <circle cx="86" cy="357" r="16"/>
  </g>

  <g id="numbers" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">
    <text x="86" y="147" dy="0.35em">1</text>
    <text x="86" y="217" dy="0.35em">2</text>
    <text x="86" y="287" dy="0.35em">3</text>
    <text x="86" y="357" dy="0.35em">4</text>
  </g>

  <g id="labels" font-size="21" fill="#E9EFF8">
    <text x="120" y="147" dy="0.35em">纯 TUN 不注入，是正确行为，不用管</text>
    <text x="120" y="217" dy="0.35em">断开不等于退出，以流量真相为准</text>
    <text x="120" y="287" dy="0.35em">搬到搜索范围之外，手动安装接管一次</text>
    <text x="120" y="357" dy="0.35em">手设变量先快照，卸载按快照还</text>
  </g>
</svg>
